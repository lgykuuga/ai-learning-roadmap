<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 6个月学习路线图</title>
<style>
:root {
  --pri:#19c8b9; --pri-deep:#0d756e; --paper:#fff8e8; --paper-strong:#fffdf5;
  --ink:#725d42; --muted:#8e785d; --line:#dfc9a8; --coral:#f0a870; --leaf:#83b66f;
  --shadow:#c9aa7d; --rds:22px; --rds-sm:14px;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box }

/* base + scrollbar */
html { scroll-behavior:smooth; background:#ead6ad; scrollbar-gutter:stable }
body {
  font-family:ui-rounded,"Nunito","Zen Maru Gothic","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 6% 11%,rgba(25,200,185,.13) 0 90px,transparent 92px),
    radial-gradient(circle at 96% 30%,rgba(240,168,112,.14) 0 120px,transparent 122px),
    linear-gradient(180deg,#fff8e8 0%,#f8edcf 100%);
  color:var(--ink); line-height:1.6; min-height:100vh; letter-spacing:.01em;
}
body::before {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.24;
  background-image:radial-gradient(#c9aa7d 1px,transparent 1px); background-size:24px 24px;
  mask-image:linear-gradient(to bottom,transparent,black 22%,black 80%,transparent);
}
::-webkit-scrollbar { width:8px }
::-webkit-scrollbar-track { background:#f2e4c8 }
::-webkit-scrollbar-thumb { background:#c9aa7d; border-radius:999px }
::-webkit-scrollbar-thumb:hover { background:#b48c5d }

/* header */
.header {
  min-height:132px; padding:20px 32px; overflow:hidden; position:sticky; top:0; z-index:100;
  background:linear-gradient(112deg,#0d756e 0%,#159f94 54%,#78d8ca 100%);
  border:0; box-shadow:0 8px 0 #075a55,0 16px 36px rgba(65,119,105,.18);
}
.header::before,.header::after { content:""; position:absolute; border-radius:50%; background:rgba(255,248,232,.25); pointer-events:none }
.header::before { width:260px; height:260px; left:-90px; top:-170px }
.header::after { width:180px; height:180px; right:180px; bottom:-145px }
.header-inner { position:relative; z-index:2; display:flex; align-items:center; gap:24px; flex-wrap:wrap; max-width:1380px; margin:0 auto; min-height:92px; padding-right:200px }
.header h1 { font-size:1.62rem; font-weight:900; color:#fff9e6; text-shadow:0 3px 0 rgba(86,76,57,.42); letter-spacing:.02em }
.header .subtitle { color:#eaf8ef; font-weight:700; margin-top:4px }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; flex-shrink:0 }

/* pure-CSS mascot */
.header-art { position:absolute; z-index:1; right:32px; top:50%; transform:translateY(-50%); pointer-events:none; width:120px; height:100px }
.mascot-body { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:64px; height:56px; background:#f5c76b; border-radius:50% 50% 45% 45%; box-shadow:0 4px 0 #dba63f }
.mascot-head { position:absolute; bottom:52px; left:50%; transform:translateX(-50%); width:50px; height:48px; background:#f5c76b; border-radius:50% }
.mascot-eye { position:absolute; width:7px; height:8px; background:#513e29; border-radius:50% }
.mascot-eye.l { bottom:62px; left:calc(50% - 12px) }
.mascot-eye.r { bottom:62px; left:calc(50% + 5px) }
.mascot-beak { position:absolute; bottom:56px; left:50%; transform:translateX(-50%); width:8px; height:5px; background:var(--coral); border-radius:0 0 4px 4px }
.mascot-wing { position:absolute; bottom:28px; width:28px; height:18px; background:#e8b74b; border-radius:50%; animation:wingFlap 2.5s ease-in-out infinite }
.mascot-wing.l { left:calc(50% + 34px) }
.mascot-wing.r { left:calc(50% - 62px) }
@keyframes wingFlap { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
.leaf { position:absolute; width:24px; height:12px; border-radius:100% 0 100% 0; background:#72ad64; box-shadow:18px 16px 0 #f3c56d }
.leaf-one { left:16px; top:56px; transform:rotate(-25deg) }
.leaf-two { right:12px; bottom:0; transform:rotate(155deg) }

/* buttons */
.btn {
  padding:9px 16px; border:2px solid #b9976e; border-radius:999px; background:#fffaf0; color:var(--ink);
  box-shadow:0 4px 0 #b9976e; font-weight:800; cursor:pointer; font-size:.82rem; white-space:nowrap;
  font-family:inherit; transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.btn:hover { border-color:#9d7a52; background:#fffdf8; transform:translateY(-1px); box-shadow:0 5px 0 #9d7a52 }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #9d7a52 }
.btn-primary { background:var(--pri-deep); border-color:#07544f; color:#fffdf5; box-shadow:0 4px 0 #07544f }
.btn-primary:hover { background:#11887f; border-color:#064d49; box-shadow:0 5px 0 #064d49 }
.header .btn-primary { background:var(--coral); border-color:#bd7546; color:#513e29; box-shadow:0 4px 0 #bd7546 }
.header .btn-primary:hover { background:#f5b684; border-color:#a9653d; box-shadow:0 5px 0 #a9653d }
.btn-danger { border-color:#c36f67; color:#b85e57; box-shadow:0 4px 0 #c36f67 }
.btn-danger:hover { background:#d9786f; border-color:#a95952; color:#fff; box-shadow:0 5px 0 #a95952 }
.btn-sm { padding:4px 10px; font-size:.75rem }

/* layout */
.main { max-width:1380px; margin:0 auto; padding:34px 32px 64px; display:flex; gap:30px }
.sidebar { width:270px; flex-shrink:0; position:sticky; top:166px; align-self:flex-start; max-height:calc(100vh - 190px); overflow-y:auto }
.content { flex:1; min-width:0 }

/* cards */
.progress-card,.side-nav,.phase-card,.modal { background:var(--paper-strong); border:2px solid var(--line); box-shadow:0 6px 0 var(--shadow),0 12px 28px rgba(114,93,66,.12) }
.progress-card { border-radius:var(--rds); padding:20px; margin-bottom:24px }
.progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px }
.progress-header h2 { font-size:1rem; font-weight:900; color:#674f35 }
.progress-pct { font-size:1.6rem; font-weight:900; color:var(--pri-deep); text-shadow:0 2px 0 #d9f3ed }
.progress-bar-outer { height:14px; background:#eadbbc; border:2px solid #d7bf98; border-radius:999px; box-shadow:inset 0 2px 3px rgba(114,93,66,.12); margin-bottom:8px; overflow:hidden }
.progress-bar-inner { height:100%; background:linear-gradient(90deg,#19c8b9,#84c978); border-radius:999px; transition:width .6s cubic-bezier(.4,0,.2,1) }
.progress-detail { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted) }
.stats-row { display:flex; gap:10px; margin-top:14px }
.stat-item { flex:1; text-align:center; padding:10px 6px; background:#f8eed7; border:1px solid #e4d2b3; border-radius:16px }
.stat-val { font-size:1.3rem; font-weight:700; color:#674f35 }
.stat-label { font-size:.72rem; color:var(--muted); font-weight:700 }

/* side nav */
.side-nav { border-radius:var(--rds); overflow:hidden }
.side-nav-title { padding:14px 16px; background:#f2e2c4; border-bottom:2px dashed #d5bb92; color:#725d42; font-weight:900; font-size:.82rem; text-transform:uppercase; letter-spacing:.05em }
.side-nav a { display:flex; align-items:center; gap:10px; padding:10px 16px; color:var(--muted); text-decoration:none; font-size:.84rem; font-weight:700; border-bottom:1px dashed #ead9bc; transition:all .18s ease }
.side-nav a:last-child { border-bottom:0 }
.side-nav a:hover { background:#edf9f4; color:#5f4b34; padding-left:20px }
.side-nav a.active { color:#147d75; background:#dff7f2; box-shadow:inset 5px 0 0 var(--pri) }
.side-nav a .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; border:2px solid rgba(114,93,66,.2) }
.side-nav a:nth-of-type(1) .dot { background:#19c8b9 }
.side-nav a:nth-of-type(2) .dot { background:#e0b85e }
.side-nav a:nth-of-type(3) .dot { background:#f0a870 }
.side-nav a:nth-of-type(4) .dot { background:#b69ac7 }
.side-nav a:nth-of-type(5) .dot { background:#83b66f }
.side-nav a .pct { margin-left:auto; font-size:.72rem; color:#aa9275 }

/* checkin card */
.modal input,.modal textarea,.modal select,.day-note-input {
  background:#fffdf7; border:2px solid #d9c19c; border-radius:14px; color:var(--ink);
  padding:8px 10px; font-size:.82rem; font-family:inherit;
  box-shadow:inset 0 2px 0 rgba(201,170,125,.12); transition:border-color .15s,box-shadow .15s,background .15s;
}
.modal input:hover,.modal textarea:hover,.modal select:hover,.day-note-input:hover { border-color:#b9976e }

/* phase cards */
.phase-card { border-radius:26px; margin-bottom:28px; overflow:hidden }
.phase-header { min-height:78px; padding:18px 24px; display:flex; align-items:center; gap:14px; cursor:pointer; user-select:none; background:linear-gradient(90deg,#fffdf5,#f8eed9); transition:background .18s }
.phase-header:hover { background:linear-gradient(90deg,#f4fbf6,#f8eed9) }
.phase-num { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.9rem; color:#fff; flex-shrink:0; background:var(--pri); border:3px solid #fffdf5; box-shadow:0 3px 0 var(--pri-deep) }
.phase-info { flex:1 }
.phase-info h3 { color:#654c31; font-size:1.08rem; font-weight:900 }
.phase-info .phase-meta { color:var(--muted); font-weight:700; font-size:.78rem; margin-top:2px }
.phase-progress-mini { text-align:right; flex-shrink:0 }
.phase-progress-mini .ppct { font-weight:900; font-size:.95rem; color:var(--pri-deep) }
.phase-progress-mini .pbar-outer { width:80px; height:8px; background:#eadbbc; border:1px solid #d7bf98; border-radius:999px; margin-top:4px; overflow:hidden; box-shadow:inset 0 2px 3px rgba(114,93,66,.12) }
.phase-progress-mini .pbar-inner { height:100%; background:linear-gradient(90deg,#19c8b9,#84c978); border-radius:999px; transition:width .4s ease }
.phase-arrow { color:#947552; width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:#f1dfbe; flex-shrink:0; transition:transform .3s cubic-bezier(.4,0,.2,1) }
.phase-arrow.open { transform:rotate(180deg) }

/* collapsible panels – animated max-height */
.phase-body,.week-body,.day-body { max-height:0; overflow:hidden; transition:max-height .45s cubic-bezier(.4,0,.2,1),padding .45s cubic-bezier(.4,0,.2,1) }
.phase-body { padding:0 24px; background:#fffdf6; border-top:0 dashed #ead6b7 }
.phase-body.open { max-height:30000px; padding:20px 24px 26px; border-top-width:2px }
.week-body { padding:0 16px; border-top:0 dashed #d7bd95 }
.week-body.open { max-height:30000px; padding:14px 16px }
.day-body { padding:0 14px; background:#fffbf0; border-top:0 dashed #e3cfad; font-size:.82rem; line-height:1.75 }
.day-body.open { max-height:20000px; padding:14px }
.phase-desc { color:#80694f; background:#f9efd9; border-left:5px solid var(--pri); border-radius:6px 16px 16px 6px; padding:12px 14px; font-size:.85rem; line-height:1.7; margin-bottom:16px }

/* week cards */
.week-card { background:#f4e4c8; border:2px solid #dbc29b; border-radius:18px; box-shadow:0 4px 0 #d1b387; margin-bottom:16px }
.week-header { min-height:52px; padding:12px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-weight:900; font-size:.88rem; color:#684f34 }
.week-header:hover { background:#eaf7ed }
.week-check,.day-check { width:18px; height:18px; border-radius:7px; border:2px solid #a98761; background:#fffdf7; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:all .15s }
.week-check.done,.day-check.done { background:var(--leaf); border-color:#608d54; box-shadow:0 2px 0 #608d54 }
.week-check.done::after,.day-check.done::after { content:"✓"; color:#fff; font-size:11px; font-weight:700 }
.day-num { font-size:.72rem; color:#bf794c; font-weight:900; background:#ffebd8; border-radius:999px; padding:2px 7px; text-align:center; min-width:28px }
.day-meta { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:.75rem; color:#aa9275 }

/* day cards */
.day-card { background:#fffdf7; border:2px solid #e3cfad; border-radius:16px; box-shadow:0 3px 0 #dcc39c; margin-bottom:13px }
.day-header { min-height:48px; padding:10px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-size:.84rem; font-weight:750; color:#725d42 }
.day-header:hover { background:#f3fbf7 }

/* rich text */
.rt-section { margin-bottom:14px; margin-top:6px }
.rt-section-title { font-weight:900; color:#b76f43; font-size:.85rem; margin-bottom:6px; display:flex; align-items:center; gap:6px; letter-spacing:.01em }
.rt-section-icon { font-size:1rem; flex-shrink:0 }
.rt-section-sub { color:var(--muted); font-size:.76rem; margin-bottom:4px }
.rt-spacer { height:6px }
.rt-ol,.rt-ul { margin:6px 0 12px 0; padding-left:22px }
.rt-ol li,.rt-ul li { margin:4px 0; color:var(--muted); line-height:1.72 }
.rt-ol li::marker { font-weight:800; color:#b76f43; font-size:.82rem }
.rt-ul li::marker { color:var(--pri-deep) }
.rt-para { margin:4px 0 8px 0; color:var(--muted); line-height:1.72 }
.rt-java-note { margin:10px 0; padding:10px 14px; background:linear-gradient(135deg,#eaf4fb,#e9ecfc); border:2px solid #b9ccf5; border-radius:14px; color:#3e5580; font-size:.82rem; line-height:1.65; animation:noteIn .35s ease }
.rt-java-note strong { color:#2a3f6b }
@keyframes noteIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
.rt-code { margin:10px 0; padding:14px 16px; background:#f6f2e8; border:1px solid #d7c9a8; border-radius:12px; font-family:"JetBrains Mono","Fira Code","Cascadia Code","Consolas",monospace; font-size:.78rem; line-height:1.65; overflow-x:auto; white-space:pre; color:#5f4b34; box-shadow:inset 0 2px 4px rgba(114,93,66,.08) }
.rt-kw { color:#147d75; font-weight:700 }
.rt-arrow-note { color:var(--muted); font-size:.78rem }
.day-body code { background:#e3f7f1; color:#147d75; border:1px solid #b9e3d9; border-radius:5px; padding:1px 6px; font-size:.78rem }
.day-body strong { color:#674f35 }

/* notes */
.day-note-row { display:flex; gap:8px; align-items:center; margin-top:8px; padding-top:10px; border-top:1px dashed #ddc5a0 }
.day-note-input { flex:1; padding:6px 10px; font-size:.78rem; font-family:inherit }
.day-note-input:focus { outline:none; border-color:var(--pri-deep); background:var(--paper-strong) }
.day-note-input::placeholder { color:#aa9275 }

/* tip cards */
.tip-card { background:linear-gradient(135deg,#fff3d3,#edf8e7); border:2px solid #e3bd70; border-radius:18px; box-shadow:0 3px 0 #d5a956; padding:14px 16px; margin:12px 0; font-size:.82rem; color:#796047 }
.tip-card::before { content:"🌱 "; font-weight:700 }
.tip-card strong { color:#674f35 }

/* resource tags */
.resource-block { margin-top:16px }
.resource-block h4 { color:#735a3f; font-weight:900; font-size:.8rem; margin-bottom:6px }
.resource-tags { display:flex; flex-wrap:wrap; gap:6px }
.resource-tag { display:inline-block; padding:5px 12px; border-radius:999px; font-size:.73rem; font-weight:800; text-decoration:none; border:2px solid; transition:transform .15s,box-shadow .15s }
.resource-tag.free { background:#e8f6df; color:#557e49; border-color:#a8ca95 }
.resource-tag.paid { background:#fff0d0; color:#9a6b22; border-color:#e3bd70 }
.resource-tag:hover { transform:translateY(-2px); box-shadow:0 3px 0 currentColor }

/* modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(60,91,79,.58); backdrop-filter:blur(5px); z-index:200; align-items:center; justify-content:center }
.modal-overlay.show { display:flex }
.modal { border-radius:26px; padding:26px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 8px 0 #ad8c63,0 22px 60px rgba(70,55,36,.3) }
.modal h3 { color:#674f35; font-size:1.15rem; font-weight:900; margin-bottom:12px }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px }

.week-arrow,.day-arrow { color:#aa9275; font-size:.8rem }
.week-meta { margin-left:auto; font-size:.75rem; color:#aa9275 }

/* dot colors */
.dot-p1 { background:#19c8b9 } .dot-p2 { background:#e0b85e } .dot-p3 { background:#f0a870 }
.dot-p4 { background:#b69ac7 } .dot-p5 { background:#83b66f }

.modal label { color:#80694f; font-weight:800; font-size:.82rem; display:block; margin-bottom:4px }
.modal input,.modal textarea,.modal select { width:100%; margin-bottom:10px }
.modal input:focus,.modal textarea:focus,.modal select:focus { outline:none; border-color:var(--pri-deep) }

/* toasts */
.toast-container { position:fixed; top:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:8px }
.toast { padding:10px 18px; border-radius:16px; font-size:.82rem; color:#fffdf5; font-weight:800; animation:slideIn .3s ease; border:2px solid rgba(93,72,48,.28); box-shadow:0 4px 0 rgba(93,72,48,.35),0 10px 24px rgba(93,72,48,.18) }
.toast.success { background:#77ad68 }
.toast.info { background:#1ab7aa }
@keyframes slideIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }

/* a11y */
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.week-check:focus-visible,.day-check:focus-visible { outline:3px solid rgba(25,200,185,.42); outline-offset:3px; border-color:var(--pri-deep) }
::selection { background:#bceee6; color:#513e29 }

weeks:[

{topic:"Python 环境搭建：从 IDEA 到 PyCharm 的丝滑切换",hours:3,resource:"python.org 官方下载 + JetBrains PyCharm",
detail:`【今日目标】在电脑上装好 Python 3.11+，用 PyCharm 跑通第一个 Jupyter Notebook。你是 IDEA 老用户，PyCharm 和 IDEA 同出一门——快捷键、界面布局、项目结构几乎一样，零学习成本。

【具体步骤——亲儿子 IDE，照着做】
1. 去 python.org 下载 Python 3.11 或 3.12，安装时务必勾选「Add Python to PATH」
   → 验证：终端敲 python --version，看到 Python 3.11.x 就对了（和 java -version 同理）

2. 下载 PyCharm Community（免费版够用）或 Professional（如果你已有 JetBrains 全家桶授权）
   → jetbrains.com/pycharm/download
   → 打开后界面和 IDEA 一模一样：Project 面板、Run 按钮、Terminal 标签、Git 集成——你不需要重新学任何东西

3. PyCharm 新建项目：
   → New Project → 选 Pure Python → 虚拟环境选 Virtualenv（PyCharm 会自动创建 .venv）
   → 项目建好后，左侧 Project 面板就是你的包结构——和 IDEA 的 src/main/java 对应

4. PyCharm 内置 Jupyter 支持，不需要装任何插件。但最重要的一招是这个——cell 模式：

   在动手之前，先把后面几天会用到的核心包装上。PyCharm 底部打开 Terminal 标签页，敲：
   uv add numpy pandas matplotlib jupyter
   看到 "Installed XX packages" 就是装好了。这和 Maven 的 mvn install 一样，依赖自动写进 pyproject.toml。

   问：什么是 #%% cell？
   答：在一个普通 .py 文件里，写上 #%% 这行注释，PyCharm 就会自动在它左侧冒出一个绿色三角 ▶。

   就像你以前在 IDEA 里「选中一段 Java 代码 → 右键 → Run」那样——但不需要每次手动选了，#%% 帮你提前标好了分界线。

   来看一个例子。新建一个 hello.py，写入以下内容：

   print("hello")       ← 这段代码没有 #%% 标记，属于第一个 cell

   #%%                  ← 这里画了一条线：以下是第二个 cell
   import numpy as np
   arr = np.array([1,2,3])
   print(arr.sum())     ← 鼠标点在这一行，左侧会出现 ▶ 按钮

   #%%                  ← 又画一条线：以下是第三个 cell
   import matplotlib.pyplot as plt
   plt.plot([1,2,3])
   plt.show()

   保存文件后，你会发现每个 #%% 左边多了一个绿色 ▶。点第一个 ▶ 只跑 print("hello")，点第二个 ▶ 只跑 numpy 那几行，点第三个 ▶ 只跑画图。

   → 这比浏览器版的 Jupyter 强在哪？因为这个文件就是普通 .py，可以正常进 Git、做 diff、跑 CI——不受限于 .ipynb 那种 JSON 格式

   → 右键 → New → Jupyter Notebook 也行（传统的 .ipynb 文件），但以后你大概率会爱上 #%% 的轻量

5. PyCharm 的 Python Console（对标 IDEA 的 Groovy Console）：
   → 底部 Tool 栏 → Python Console → 交互式 REPL，随时测试代码片段
   → 选中任意代码右键 → Execute Selection in Console（Alt+Shift+E）——你调试 Java 用了十年的操作，完全一样

【关键理解——Java vs Python 生态对照（用你已有的 IDEA 概念映射）】
• JDK 17/21 → Python 3.11/3.12 Interpreter（Project Structure → SDK）
• IntelliJ IDEA → PyCharm（完全相同的 UI/快捷键/项目管理）
• Maven/Gradle pom.xml → pyproject.toml / requirements.txt
• src/main/java/com/xxx → src/your_project/（Python 不强求目录=包名）
• .java class → .py module（Python 一个文件就是一个模块，可以写多个 class）
• Run Configuration → 和 IDEA 一模一样，选 Script path 或 Module name
• Git 集成 → 和 IDEA 一模一样，Ctrl+K 提交, Ctrl+Shift+K 推送
• Debug 断点 → 和 IDEA 一模一样，左侧红点，F8 Step Over, F7 Step Into
• Terminal → Alt+F12，和 IDEA 完全一样，内置终端随便敲

【PyCharm 专属技巧——IDEA 用户拿来就用】
• 双击 Shift：万能搜索（和 IDEA 一样）——搜文件、搜类、搜 Action
• Ctrl+Shift+F10：运行当前文件（和 IDEA 的 run 一样）
• Ctrl+Alt+Shift+L：格式化代码（和 IDEA 一样）
• .py 文件里写 #%% cell 标记 + Ctrl+Enter 执行当前 cell → 不需要单独开 Jupyter！
• Scientific Mode：View → Scientific Mode → 右侧自动弹出变量面板+图表

【今日产出】用 PyCharm 创建一个项目，在里面新建一个 .py 文件用 #%% cell 方式写代码，再新建一个 .ipynb 文件跑一遍。两个都截图，发到学习笔记里。`},
{topic:"变量、数据类型、字符串：感受动态类型的自由与约束",hours:3,resource:"《Python编程：从入门到实践》第1-3章",
detail:`【今日目标】掌握 Python 的基础数据类型和字符串操作，重点体会「动态类型」和 Java 静态类型的差异。

【动手练习——每个都要在 Jupyter 里跑一遍】
1. 变量声明对比：
   Java: String name = "张三"; int age = 30;
   Python: name = "张三"; age = 30  ← 不需要类型声明！
   试试 type(name), type(age), 再试试 age = "三十" 后 type(age)——这在 Java 里会编译报错

2. 数字类型：a=10; b=3; print(a/b, a//b, a%b, a**b)
   注意 a/b 返回 float（3.333...），a//b 才是整除（Java 的 / 对 int 是整除，Python 不是！）

3. 字符串：f-string 是 Python 最常用的字符串格式化
   name="World"; print(f"Hello {name}! 1+1={1+1}")  ← 对标 Java 的 String.format 但简洁得多

4. 字符串操作：s="Hello Python"; print(s[0:5], s[6:], s[::-1])
   切片是 Python 最常用的操作之一，Java 没有等价物——必须用 substring() 链式调用

【核心概念】Python 的「动态类型」意味着变量只是标签，可以贴在任何类型的对象上。优点是灵活，缺点是 IDE 提示不如 Java 精确——后面会用 Type Hints 弥补。

【今日产出】在 Jupyter 里写 20 行代码，把 Java 中常用的字符串格式化/拼接操作用 Python 重写一遍。`},
{topic:"列表、字典、元组、集合：Python 四大内置数据结构",hours:3,resource:"Python 官方文档: Data Structures",
detail:`【今日目标】精通列表(list)、字典(dict)、元组(tuple)、集合(set)，它们是 Python 编程中使用频率最高的数据结构。

【动手练习——逐一对比 Java】
1. 列表 List → Java ArrayList，但语法简洁 10 倍：
   nums = [1,2,3,4,5]
   nums.append(6)       # Java: nums.add(6)
   nums[0] = 10         # 直接赋值
   nums[-1]             # 最后一个元素，Java 没有负索引！
   nums[1:4]            # 切片 [2,3,4]
   [x*2 for x in nums if x>3]  # ← 列表推导式！Java 要用 Stream.map().filter().collect()

2. 字典 Dict → Java HashMap：
   d = {"name":"张三","age":30}
   d["city"] = "北京"    # d.put("city","北京")
   d.get("gender","未知") # 带默认值的 get
   for k,v in d.items(): print(k,v)  # 遍历

3. 列表推导式专项训练——这是 Python 第一个杀手级特性：
   用 Python 一行实现：从 1-100 中选偶数，平方，取大于 1000 的
   [x**2 for x in range(1,101) if x%2==0 and x**2>1000]
   → 用 Java Stream 写一遍同样逻辑，感受代码量差异

4. 元组 tuple → 不可变列表。集合 set → Java HashSet，自动去重。

【Java 对照思考】Python 用 [] 和 {} 两种符号覆盖了 Java 需要 ArrayList/HashMap/HashSet/Arrays 四种类型完成的工作。不是 Python 更「弱」——而是内置数据结构更强大。

【今日产出】写 3 个列表推导式，并分别用 Java Stream 重写，放到学习笔记里形成对比表格。`},
{topic:"函数、lambda、异常处理：代码组织方式的变化",hours:3,resource:"Real Python: Defining Your Own Python Function",
detail:`【今日目标】掌握 Python 函数定义方式，理解 *args/**kwargs、lambda、装饰器的基本概念，以及异常处理与 Java 的差异。

【动手练习】
1. 函数定义——对比 Java：
   Python: def greet(name: str, age: int = 18) -> str:
               return f"{name} is {age} years old"
   Java:   public String greet(String name, int age) { return name + " is " + age; }
   注意：① def 不是 public/private ② 参数可以有默认值 ③ 返回类型标注是可选的

2. *args 和 **kwargs——可变参数：
   def log_all(*args, **kwargs):
       for a in args: print(a)
       for k,v in kwargs.items(): print(f"{k}={v}")
   log_all("a","b", name="张三", age=30)
   Java 里要用 method(String... args) + Map 才能模拟，远没有这么方便。

3. Lambda 表达式：
   Python: sorted(users, key=lambda u: u.age)
   Java:   users.stream().sorted(Comparator.comparing(User::getAge))
   功能等价，但 Python 的 lambda 更轻量（只允许单个表达式）

4. 异常处理——关键差异：
   Python 没有 checked exception！所有异常都是 runtime。
   try/except/else/finally——else 在没异常时执行，Java 没有这个
   raise ValueError("msg") → Java: throw new IllegalArgumentException("msg")

【今日产出】用 Python 写一个带类型标注和文档字符串的函数，实现「解析 CSV 文件→过滤→排序→输出」，用 try/except 处理文件不存在的异常。`},
{topic:"面向对象对比：class、继承、魔术方法",hours:3,resource:"Real Python: OOP in Python 3",
detail:`【今日目标】理解 Python 的面向对象模型与 Java 的核心差异。Python 的 OOP 更轻量，有很多 Java 没有的特性(魔术方法、property、多继承)。

【动手练习——把 Java 类翻译成 Python】
1. 基本类定义对比：
   Java:
   public class Person {
       private String name;
       private int age;
       public Person(String name, int age) { this.name=name; this.age=age; }
       public String getName() { return name; }
   }
   Python:
   class Person:
       def __init__(self, name: str, age: int):
           self.name = name
           self.age = age
   注意：self 相当于 Java 的 this，但必须显式传入每个方法。Python 没有 private 关键字——约定 _name 表示 protected，__name 表示 name mangling。

2. @property 装饰器——Python 的 getter/setter 语法糖：
   @property
   def age(self): return self._age
   @age.setter
   def age(self, value):
       if value < 0: raise ValueError("年龄不能为负")
       self._age = value
   比 Java 的 getAge()/setAge() 优雅太多了——外部访问仍然是 obj.age

3. 魔术方法（__str__, __repr__, __eq__, __len__, __getitem__ 等）：
   这些是 Python 最独特的 OOP 特性。实现 __str__ 相当于 Java 的 toString()
   实现 __eq__ 相当于 Java 的 equals()
   实现 __getitem__ 让你的对象可以 obj[0] 这样访问——Java 没有直接对应物

4. 多继承 + MRO（方法解析顺序）：
   Python 支持多继承，通过 C3 线性化算法决定方法查找顺序。Java 只有单继承+多接口。

【今日产出】定义一个「带类型验证的数据类」——用 @property 做 setter 校验，实现 __str__/__eq__/__repr__。`},
{topic:"装饰器、生成器、上下文管理器：Python 的三大独门武器",hours:3,resource:"《Fluent Python》第7-9章 + Real Python: Decorators",
detail:`【今日目标】掌握装饰器、生成器、上下文管理器——这三个是 Python 独有的编程范式，Java 没有直接对应物，但它们在实际 AI 项目中大量使用。

【动手练习】
1. 装饰器 Decorator——包裹函数的函数：
   import time
   def timer(func):
       def wrapper(*args, **kwargs):
           start = time.time()
           result = func(*args, **kwargs)
           print(f"{func.__name__} 耗时 {time.time()-start:.2f}s")
           return result
       return wrapper

   @timer
   def slow_function():
       time.sleep(1)

   装饰器本质：timer(slow_function) → 返回 wrapper 函数替代原函数。
   Java 里最接近的是 AOP（AspectJ / Spring AOP），但装饰器是语言级支持，轻量得多。

2. 生成器 Generator——惰性迭代器：
   def fibonacci(n):
       a, b = 0, 1
       for _ in range(n):
           yield a     # ← yield 使得函数变成生成器
           a, b = b, a + b
   每次调用 next() 执行到下一个 yield——节省内存，适合处理大数据流。
   Java 没有 yield 关键字，最接近的是自定义 Iterator 实现，但代码量是 5-10 倍。

3. 上下文管理器 with 语句：
   with open("file.txt") as f:    # ← 自动关闭文件，不需要 finally
       content = f.read()
   等价于 Java 的 try-with-resources（Java 7+），但 Python 可以自定义：
   class MyContext:
       def __enter__(self): print("进入"); return self
       def __exit__(self, *args): print("退出")

【今日产出】写一个 @retry(max_attempts=3) 装饰器，让被装饰的函数在抛异常时自动重试。用它装饰一个模拟 API 调用的函数。`},
{topic:"小项目：用 Python 重写一个 Java 工具模块",hours:3,resource:"你自己的旧 Java 代码仓库",
detail:`【今日目标】选一个你以前用 Java 写的工具模块（200-500 行左右），用 Python 完全重写。通过实际对比，建立「Python 手感」。

{topic:"NumPy 核心——ndarray 与向量化计算",hours:3,resource:"NumPy 官方 Quickstart Tutorial",
detail:`【今日目标】理解 ndarray（N-dimensional array）是 NumPy 的核心，掌握创建、索引、切片操作。ndarray 是 Python 数据科学栈的「通用货币」——Pandas/TensorFlow/PyTorch 都基于它。

【动手练习——在 Jupyter 里逐个运行】
1. 安装和导入：
   uv add numpy
   import numpy as np

2. ndarray 创建：
   a = np.array([1,2,3,4,5])           # 从列表创建
   b = np.zeros((3,4))                  # 3行4列全零矩阵
   c = np.ones((2,3))                   # 全1
   d = np.arange(0, 10, 0.5)           # 起始,终止,步长——对标 Python range 但支持浮点数
   e = np.random.randn(3,3)            # 3×3 标准正态分布随机数
   关键属性：a.shape, a.dtype, a.ndim, a.size

3. 索引与切片——比 Python 原生列表强大多了：
   arr = np.arange(24).reshape(4,6)    # 4行6列
   arr[1, 2]          # 第1行第2列
   arr[:, 1:3]        # 所有行，第1-2列
   arr[arr > 10]      # 布尔索引——选出所有大于10的元素
   arr[[0,2,3]]       # 花式索引——选第0,2,3行

4. 通用函数 ufunc——向量化操作：
   arr * 2            # 每个元素乘2（不需要 for 循环！）
   np.sqrt(arr)       # 每个元素开方
   np.sin(arr)        # 三角函数
   → Java 里要做同样的事，你需要嵌套 for 循环。向量化是 AI 计算的基础。

【Java 对照】NumPy 的 ndarray 就是 Java 里你常用的 double[][] 的超级加强版——支持广播、花式索引、自动向量化。

【今日产出】用 NumPy 创建一个 5×5 的随机矩阵，然后：① 选出所有 >0.5 的元素 ② 计算每列的均值 ③ 矩阵乘法`},
{topic:"NumPy 进阶——广播机制与线性代数",hours:3,resource:"NumPy Broadcasting 文档 + Kaggle NumPy 微课程",
detail:`【今日目标】理解 NumPy 最核心的概念——广播(Broadcasting)，以及基本的线性代数操作。广播是 NumPy 的魔法——不同形状的数组可以自动对齐运算。

【动手练习——理解广播机制】
1. 广播规则（从右往左对齐维度）：
   a = np.ones((3, 4))       # shape (3,4)
   b = np.array([1,2,3,4])   # shape (4,) → 广播为 (1,4) → (3,4)
   a + b                      # 每行都加上 [1,2,3,4]

   c = np.array([[1],[2],[3]]) # shape (3,1) → 广播为 (3,4)
   a + c                       # 每列加上对应值

   失败的广播：
   d = np.array([1,2,3])       # shape (3,) → 无法与 (3,4) 广播（最后一维 3≠4）

2. 用广播替代 for 循环——实战案例：
   目标：将 100×100 的矩阵每一行减去该行的均值
   X = np.random.randn(100, 100)
   row_means = X.mean(axis=1, keepdims=True)  # shape (100,1)
   X_centered = X - row_means                  # 自动广播！
   → 纯 Java 写法需要嵌套 for 循环 10000 次迭代

3. 线性代数：
   A @ B              # 矩阵乘法（Python 3.5+ 的 @ 运算符）
   np.dot(A, B)        # 等价写法
   np.linalg.inv(A)    # 矩阵求逆
   np.linalg.eig(A)    # 特征值/特征向量
   np.linalg.svd(A)    # 奇异值分解

4. 用 NumPy 实现梯度下降——直观感受向量化威力：
   目标：用梯度下降拟合 y=3x+2
   X = np.random.randn(100, 1); y = 3*X + 2 + np.random.randn(100,1)*0.1
   w, b = 0.0, 0.0; lr = 0.01
   for _ in range(1000):
       y_pred = X @ np.array([[w]]) + b    # 向量化预测
       dw = (X.T @ (y_pred - y)) / 100     # 向量化梯度
       db = (y_pred - y).mean()
       w -= lr * dw[0,0]
       b -= lr * db
   注意——整个过程没有 for 循环遍历 100 个样本！这就是向量化的威力。

【今日产出】用 NumPy 实现一个 3 层神经网络的前向传播（随机权重），输入 10 个样本（每个 5 维特征），输出预测结果。全程用矩阵运算，不写 for 循环。`},
{topic:"Pandas 核心 (一)：Series 与 DataFrame 入门",hours:3,resource:"Pandas 官方 Getting Started + Kaggle Pandas 微课程",
detail:`【今日目标】掌握 Pandas 两大核心数据结构：Series（一维）和 DataFrame（二维表）。DataFrame 就是「代码里的 Excel」+「内存里的 SQL 表」。

【动手练习】
1. 安装并创建第一个 DataFrame：
   uv add pandas
   import pandas as pd

   df = pd.DataFrame({
       'name': ['张三','李四','王五','赵六'],
       'age': [25, 30, 22, 35],
       'city': ['北京','上海','广州','深圳'],
       'salary': [15000, 20000, 12000, 25000]
   })

2. 基础操作：
   df.head(2)           # 前两行 = SQL: SELECT * LIMIT 2
   df.info()            # 列信息（类型/非空数量）= SQL: DESCRIBE

3. 数据选择——Pandas 最常用的操作：
   df['name']           # 选一列，返回 Series
   df[['name','age']]   # 选多列
   df.iloc[0:2]         # 按位置选行（行0到1）
   df.loc[df.age > 25]  # 按条件选行
   df.loc[0, 'salary']  # 选单个值

4. 从文件读取数据：
   df = pd.read_csv('data.csv')
   df = pd.read_excel('data.xlsx')

【Java 对照】DataFrame 对标的是你用 JDBC ResultSet + List<Map> 的组合，但 DataFrame 的操作呈数量级更简洁。把 DataFrame 想象成「可以直接筛选/聚合/透视的二维数据表」。

【今日产出】找一份公开数据集（建议 Kaggle 上的 Titanic），用 Pandas 加载，完成：head/info/describe、按年龄筛选、按性别分组统计存活率。`},
{topic:"Pandas 核心 (二)：数据清洗——处理真实世界的脏数据",hours:3,resource:"Pandas: Working with missing data",
detail:`【今日目标】掌握数据清洗的核心操作：缺失值处理、重复值删除、类型转换、字符串清洗。真实世界的数据永远是脏的——数据清洗占数据科学家 60-80% 的工作量。

【动手练习——用一份刻意弄脏的数据集练习】
1. 先创建一份脏数据：
   df = pd.DataFrame({
       'name': ['张三','李四','张三',None,'王五'],
       'age': [25, None, 25, 30, -1],
       'city': ['北京','shanghai','北京','广州',None],
       'salary': ['15k','20000','15k','18000','30000']
   })

2. 缺失值处理：
   df.isnull().sum()              # 统计每列缺失数
   df.dropna()                    # 删除有缺失的行
   df.dropna(subset=['name'])     # 只在 name 列有缺失时删除
   df['age'].fillna(df['age'].median())  # 用中位数填充
   df['city'].fillna('未知')

3. 重复值处理：
   df.duplicated()                # 哪些行是重复的
   df.drop_duplicates()           # 删除完全重复的行
   df.drop_duplicates(subset=['name'])  # 按名字去重

4. 类型转换与异常值：
   df['age'] = pd.to_numeric(df['age'], errors='coerce')  # 转数字，非法值变 NaN
   df['salary'] = df['salary'].str.replace('k','000').astype(int)  # 15k→15000
   df.loc[df.age < 0, 'age'] = None  # 把-1这种异常年龄设为缺失

5. 字符串清洗：
   df['city'] = df['city'].str.strip().str.lower().str.capitalize()  # 链式清洗

【Java 对照】这些操作在 Java 里需要 Stream + 大量自定义函数，Pandas 一行一个操作，每个操作的含义非常清晰。

【今日产出】把第3天练习的 Titanic 数据完整清洗一遍（处理缺失、转换类型、清洗文本），保存为 clean_titanic.csv。`},
{topic:"Pandas 核心 (三)：groupby、merge、pivot——数据分析三板斧",hours:3,resource:"Pandas: Group By + Merge + Reshaping",
detail:`【今日目标】掌握 Pandas 的数据分析三板斧：groupby(分组聚合)、merge(表连接)、pivot_table(透视表)。它们分别对标 SQL 的 GROUP BY、JOIN、PIVOT。

【动手练习——建两个 DataFrame 模拟电商数据】
1. 创建模拟数据：
   orders = pd.DataFrame({
       'order_id': range(1,9),
       'user_id': [1,1,2,3,2,1,3,2],
       'product': ['A','B','A','C','B','C','A','B'],
       'amount': [100,200,150,300,250,180,120,220]
   })
   users = pd.DataFrame({
       'user_id': [1,2,3,4],
       'name': ['张三','李四','王五','赵六'],
       'vip': [True,False,True,False]
   })

2. GroupBy——对标 SQL GROUP BY：
   orders.groupby('user_id')['amount'].sum()         # 每个用户消费总额
   orders.groupby('user_id').agg({                    # 多指标聚合
       'amount': ['sum','mean','count'],
       'order_id': 'count'
   })
   orders.groupby('user_id').filter(lambda x: x.amount.sum() > 300)  # 筛选高消费用户
   → Java 等价物：stream().collect(Collectors.groupingBy(...)) 但 agg 多指标远不如 Pandas 直观

3. Merge——对标 SQL JOIN：
   pd.merge(orders, users, on='user_id', how='left')  # LEFT JOIN
   pd.merge(orders, users, on='user_id', how='inner') # INNER JOIN
   → Pandas 的 merge 直接对标 SQL JOIN，语法比你用 JDBC 写 SQL 还简洁

4. Pivot Table——交叉分析利器：
   pd.pivot_table(orders, values='amount', index='user_id', columns='product', aggfunc='sum', fill_value=0)
   输出一个「用户×产品」的金额矩阵——Excel 透视表的功能，Python 一行搞定。

【今日产出】用 Titanic 数据：① 按舱位等级(pclass)分组统计存活率、平均年龄、人数 ② 按性别和舱位做透视表 ③ 把三个分析结果输出为一个 Excel 的三个 sheet。`},

{topic:"综合实战：完整 EDA（数据探索分析）流程",hours:3,resource:"Kaggle: Titanic + House Prices",
detail:`【今日目标】走通一个完整的数据探索分析(EDA)流程，为后续 ML 阶段做准备。EDA 是拿到任何新数据集后的第一步——目标是在建模前充分理解数据的结构和规律。

【完整流程——照着做一遍】
1. 加载与概览（5min）：
   df = pd.read_csv('train.csv')
   df.shape, df.columns.tolist(), df.dtypes

2. 缺失值分析（10min）：
   missing = df.isnull().sum()
   missing_pct = (missing / len(df)) * 100
   print(missing_pct[missing_pct > 0].sort_values(ascending=False))
   → 画缺失值热力图：sns.heatmap(df.isnull())

3. 数值特征分析（20min）：
   df.describe()  # 关注 mean/std/min/max 是否有异常
   for col in numeric_cols:
       sns.histplot(df[col], kde=True)
       plt.title(f'{col} 分布')

4. 类别特征分析（15min）：
   for col in cat_cols:
       print(df[col].value_counts())
       sns.countplot(data=df, x=col)

5. 特征与目标关系（20min）：
   for col in numeric_cols:
       df.groupby('survived')[col].mean().plot(kind='bar')
   # 哪一列在两个类别之间差异最大 → 可能是重要特征

6. 相关性分析（10min）：
   df.corr(numeric_only=True)['survived'].sort_values(ascending=False)
   sns.heatmap(df.corr(), annot=True)

7. 撰写 EDA 报告（10min）：
   总结数据中发现的规律，提出假设（比如「女性存活率更高」「一等舱存活率高」），后续建模时可以验证。

【今日产出】在 Jupyter Notebook 里完成一个完整的 EDA 流程，每个步骤都有代码+图表+文字注释。这个 Notebook 可以放进你的 GitHub。`}

{title:"第 3 周：Python 工程化 + Jupyter 工作流",days:[
{topic:"Jupyter Notebook 精通：在 PyCharm 里玩转交互式开发",hours:3,resource:"PyCharm Scientific Mode 文档 + Jupyter 官方文档",
detail:`【今日目标】从「会用 Jupyter」到「精通 Jupyter + PyCharm 集成」。你不需要在浏览器和 IDE 之间来回切换——PyCharm 内置了完整的 Jupyter 支持，加上 #%% cell 模式，比纯浏览器 Jupyter 强得多。Jupyter 之于 AI 工程师 = IDEA 之于 Java 工程师。

【PyCharm 三种交互式开发方式——逐一对比】
1. 纯 .ipynb 文件（PyCharm 内置 Jupyter）：
   → 右键 → New → Jupyter Notebook
   → 直接在编辑器里打开 .ipynb，界面和浏览器版一样
   → 优势：代码补全比浏览器强 10 倍、有类型推断、有重构、有 Git diff
   → Shift+Enter 运行 cell（和浏览器版一样）

2. #%% cell 模式（最推荐——不需要 .ipynb 文件）：
   这个在 Day 1 已经第一次接触了，现在真正把它用起来。

   回忆一下：在普通 .py 文件中写 #%% 作为分隔线，PyCharm 会自动在每段左侧冒出一个绿色 ▶。
   点哪个 ▶，就跑哪段代码。这和你在 IDEA 里「选中一段代码 → 右键 Run」完全是一个概念，
   只是不用每回手动选了——#%% 帮你画好了分界线。

   打开你的 Titanic EDA 的 .py 文件，把整个分析流程拆成几个 cell：

   #%% 第1步：加载数据
   import pandas as pd
   df = pd.read_csv('train.csv')
   print(df.shape)              ← 点这个 cell 的 ▶，只跑加载数据

   #%% 第2步：查看缺失值
   df.isnull().sum()             ← 点这个 cell 的 ▶，只跑缺失值统计

   #%% 第3步：画图（存活率分布）
   import seaborn as sns
   sns.countplot(data=df, x='survived')  ← 点这个 cell 的 ▶，只跑画图

   #%% 第4步：分组统计
   df.groupby('sex')['survived'].mean()  ← 点这个 cell 的 ▶，只跑分组

   这样拆的好处：
   → 修改第 3 步的图表样式时，不需要重新加载数据——只点第 3 步的 ▶ 就行
   → 调试时不用从头跑到尾——哪里报错点哪里
   → 运行后右侧 SciView 面板自动弹出，能看到变量 df 的当前值、图表缩略图

   记住操作：Ctrl+Enter = 跑当前 cell，Ctrl+Shift+Enter = 跑当前并跳到下一个

3. Python Console（交互式 REPL）：
   → 底部工具栏 → Python Console
   → 选中任意代码 → Alt+Shift+E（Execute Selection in Console）
   → IDEA 里调试 Java 的方式原封不动搬到 Python

【最有用的 Magic Commands——在 PyCharm 里一样有效】
  %timeit sum(range(1000000))          # 测量执行时间

{topic:"虚拟环境与依赖管理：uv + PyCharm 集成",hours:3,resource:"uv 官方文档 (astral.sh) + PyCharm 包管理文档",
detail:`【今日目标】理解 Python 的虚拟环境概念，掌握 uv，在 PyCharm 里配好项目环境。就像 Java 项目需要 Maven 管理依赖，Python 项目需要虚拟环境和依赖锁定。PyCharm 对虚拟环境有原生支持——Settings → Project → Python Interpreter，和 IDEA 的 Project Structure → SDK 几乎一样。

【动手练习——完整走一遍】
1. 安装 uv：
   → Windows PowerShell（管理员）：powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
   → Mac/Linux：curl -LsSf https://astral.sh/uv/install.sh | sh
   → 验证：uv --version

2. uv init 创建项目——生成的结构和 Maven archetype 相似：
   uv init my-ai-project && cd my-ai-project
   → 自动生成 pyproject.toml（对标 pom.xml）、.venv/、README.md、hello.py

3. PyCharm 打开项目：
   → File → Open → 选 my-ai-project 文件夹
   → PyCharm 自动检测 .venv 并提示「Use this environment」→ Yes
   → 右下角显示「Python 3.11 (my-ai-project)」—和 IDEA 的 SDK 角标位置一样
   → 如果没自动识别：File → Settings → Project → Python Interpreter → Add Local Interpreter → 选 .venv/Scripts/python.exe

4. 添加依赖——两套方式，你都试试：
   【图形界面（和 IDEA 编辑 pom.xml 一样）】
   → 打开 pyproject.toml → dependencies 数组里输包名 → PyCharm 自动补全版本
   → Ctrl+S → 弹出提示 → Install requirements
   【命令行】
   uv add numpy pandas matplotlib jupyter
   uv add --dev pytest ruff mypy          # --dev = Maven <scope>test</scope>

5. uv.lock 锁文件：
   cat uv.lock  # 锁定所有依赖的精确版本（对标 dependency:tree + 版本锁定），必须提交 Git

【Java 对照表——用你已有的概念来理解】
• uv → Maven/Gradle（包管理+构建工具）
• pyproject.toml → pom.xml / build.gradle
• uv.lock → <dependencyManagement> 版本锁定
• .venv/ → 项目级 SDK classpath 隔离
• uv sync → mvn install（安装所有依赖）
• uv run pytest → mvn test

【PyCharm 设置检查清单——配好项目照着过一遍】
□ Project Interpreter 指向 .venv（File → Settings → Project → Python Interpreter）
□ Terminal 标签里显示 (.venv) 前缀（虚拟环境已激活）
□ pyproject.toml 里 dependencies 和 dev-dependencies 已写好
□ uv.lock 已生成并加入 Git
□ 在 PyCharm Terminal 里 uv run python -c "import numpy; print('OK')" 不报错

{topic:"Type Hints + mypy：让 Python 代码接近 Java 的安全性",hours:3,resource:"mypy 官方文档 + Python typing 模块文档",
detail:`【今日目标】掌握 Python 的 Type Hints，用 mypy 做静态类型检查。这可能是你最想学的 Python 特性——Type Hints 让 Python 代码的质量和可维护性大大提升，接近 Java 的水平。

【动手练习】
1. 基础类型标注：
   def process_data(data: list[dict[str, int | float]], threshold: float = 0.5) -> dict[str, list[int]]:
       ...
   # list[dict[str,int|float]] → List<Map<String, Integer|Double>>
   # Python 3.10+ 用 | 替代 Optional/Union

2. 复杂类型定义：
   from typing import TypedDict, Protocol, Literal

   class UserDict(TypedDict):    # 对标 Java POJO
       name: str
       age: int
       email: str | None

   class Embedder(Protocol):     # 对标 Java interface
       def embed(self, text: str) -> list[float]: ...

   Status = Literal["pending","running","done","failed"]  # 枚举类型

3. 安装和运行 mypy：
   uv add --dev mypy
   uv run mypy src/                  # 静态类型检查
   # 故意写错的代码 → mypy 会报类型不匹配，就像 javac 一样！

4. Pydantic——数据验证利器（在 AI 项目中大量使用）：
   from pydantic import BaseModel, Field
   class ChatRequest(BaseModel):
       model: str = "gpt-4"
       messages: list[dict[str, str]]
       temperature: float = Field(default=0.7, ge=0, le=2)
       max_tokens: int = Field(default=1024, gt=0)

   req = ChatRequest(messages=[{"role":"user","content":"hi"}])
   # 自动验证类型、范围，验证失败抛 ValidationError

【Java 对照】Python 的 Type Hints + mypy ≈ Java 的编译时类型检查（但不强制）。Pydantic ≈ Spring 的 @Valid + Jakarta Bean Validation。

【今日产出】把第 1 周重写的 Java 工具模块加上完整的 Type Hints，通过 mypy --strict 检查。对比加类型前后的代码——感受静态类型的优势。`},
{topic:"pytest 测试 + ruff 代码质量：Python 的 JUnit + Checkstyle",hours:3,resource:"pytest 官方文档 + ruff 官方文档",
detail:`【今日目标】掌握 pytest 写单元测试，用 ruff 做代码风格检查和自动修复。pytest 比 JUnit 更简洁，ruff 是用 Rust 写的超快 linter。

【动手练习】
1. 创建测试文件 test_calc.py：
   def add(a, b): return a + b

   def test_add_positive():     # 函数名以 test_ 开头 = @Test
       assert add(2, 3) == 5    # Python 用 assert，不需要 assertEquals

   def test_add_negative():
       assert add(-1, -1) == -2

   @pytest.mark.parametrize("a,b,expected", [   # 参数化测试 = @ParameterizedTest
       (1,1,2), (0,0,0), (-1,1,0), (100,200,300)
   ])
   def test_add_param(a, b, expected):
       assert add(a, b) == expected

   def test_add_raises():
       with pytest.raises(TypeError):    # 测试抛异常
           add("1", 2)

2. Fixture——对标 JUnit 的 @BeforeEach / @BeforeAll：
   @pytest.fixture
   def sample_data():
       return {"users": [...], "settings": {...}}

   def test_with_fixture(sample_data):   # 自动注入！
       assert len(sample_data["users"]) > 0

3. 运行测试：
   uv run pytest -v                        # verbose 模式
   uv run pytest --cov=src                 # 带覆盖率
   uv run pytest -k "test_add"             # 只跑名字匹配的测试

4. ruff——代码质量（对标 Java 的 Checkstyle + SpotBugs）：
   uv add --dev ruff
   uv run ruff check src/                  # 检查

{topic:"Python 项目结构最佳实践：src layout、pyproject.toml、导入机制",hours:3,resource:"Python Packaging Authority 指南 + pytest 官方项目的目录结构",

1. 推荐的项目结构（src layout）：
   my_project/
   ├── pyproject.toml          # 项目元数据 + 依赖 + 工具配置
   ├── README.md
   ├── src/

   │       └── cli.py
   ├── tests/

   └── notebooks/              # Jupyter notebooks

2. pyproject.toml 完整示例（对标 pom.xml）：
   [project]
   name = "my-ai-project"

3. __init__.py 的三种用法：

4. 可编辑安装（开发模式）：

【今日产出】按 src layout 重构你的 Python 工具项目，配好 pyproject.toml，确保 uv run pytest 和 uv run ruff check 都能通过。`},
{topic:"异步编程入门：async/await 与 aiohttp",hours:3,resource:"Real Python: Async IO in Python",
detail:`【今日目标】理解 Python 的 asyncio 异步编程模型。AI 应用大量使用异步——同时调用多个 LLM API、处理流式响应、并行检索都需要异步。对比 Java 的 CompletableFuture/虚拟线程。

【动手练习——从同步到异步逐步演进】
1. 理解协程（Coroutine）——不是多线程：
   async def fetch_data(url: str) -> str:
       print(f"开始获取 {url}")
       await asyncio.sleep(1)    # 模拟网络延迟
       return f"{url} 的数据"

   # 错误用法：fetch_data("url") 返回的是 coroutine 对象，不会执行
   # 正确用法：asyncio.run(fetch_data("url"))

2. 并发执行多个任务——Python 方式：
   async def fetch_all():
       urls = ["url1", "url2", "url3"]
       tasks = [fetch_data(url) for url in urls]
       results = await asyncio.gather(*tasks)    # 并发执行所有
       return results
   # 3 个任务并发执行，总耗时 ≈ 1s（而不是 3s）

3. aiohttp——异步 HTTP 客户端（实际项目中用来并发调 LLM API）：
   import aiohttp
   async def call_llm(prompt: str) -> dict:
       async with aiohttp.ClientSession() as session:
           async with session.post("https://api.openai.com/v1/chat/completions",
               headers={"Authorization": f"Bearer {api_key}"},
               json={"model":"gpt-4o-mini","messages":[{"role":"user","content":prompt}]}
           ) as resp:
               return await resp.json()

   # 并发调用 10 个 prompt：
   prompts = [...]
   results = await asyncio.gather(*[call_llm(p) for p in prompts])

【Java 对照】
• async def → public CompletableFuture<T> method()
• await → .get()（但 Python 的 await 是非阻塞的，.get() 是阻塞的——关键区别！）
• asyncio.gather → CompletableFuture.allOf

【今日产出】写一个脚本：用 aiohttp 并发请求 5 个不同的 URL（随便什么公开 API），对比同步版和异步版的耗时差异。`},

{title:"第 4 周：AI 行业全景认知 + LLM API 初体验",days:[
{topic:"AI 产业链全景：搞清楚你到底要做什么",hours:3,resource:"a16z: Who Owns the Generative AI Platform? + 各云厂商 AI 产品线",
detail:`【今日目标】建立对 AI 产业链的完整认知，明确「AI 应用开发工程师」在这个产业链中的定位。你不需要设计芯片、不需要训练 GPT——你做的事是把大模型的能力包装成用户可用的产品。

【今日必读——AI 产业链四层架构】
1. 基础设施层（Infrastructure）：NVIDIA GPU、AWS/阿里云算力、CUDA 生态
   → 这层是硬件+云厂商的事，不是你的主战场

2. 模型层（Model）：OpenAI GPT-4/Claude 3.5/开源 Llama/Qwen
   → 你用的是这些模型，不是训练它们。但你要懂怎么选模型、怎么微调

3. 平台/框架层（Platform）：LangChain/LlamaIndex/向量数据库/Spring AI
   → 这是你的核心工作区——用这些工具把模型能力组合成应用

4. 应用层（Application）：ChatGPT/Jasper/Copilot/各种 AI SaaS
   → 你开发的就是这一层——面向用户的产品

【AI 应用开发工程师的核心工作】
• 70%：基于 LLM API 构建应用（RAG、Agent、对话系统）
• 15%：数据处理与 Pipeline（清洗、向量化、检索优化）
• 10%：Prompt Engineering 与评测
• 5%：模型微调（不需要从零训练，只需要 LoRA 微调）

【你必须理解的核心概念——今天先记住这几个】
• LLM = 大语言模型 = 一个「下一个词预测器」，不是数据库、不是搜索引擎、不是事实库
• Token = 模型处理文本的最小单位（一个词≈1-2个Token，汉字≈1-3字符/Token）
• Context Window = 一次对话能塞进多少内容（GPT-4o 128K ≈ 一本书的厚度）
• Hallucination = 模型胡编（RAG + Prompt Engineering 是主要对抗手段）

【今日行动】阅读 3 篇 AI 行业文章，整理成一篇你自己的行业认知笔记。不是复制粘贴——用自己的话写。`},

{topic:"LLM 基础概念：Token、Context、Temperature——模型不是魔法",hours:3,resource:"OpenAI Tokenizer Tool + Anthropic Claude 文档: Models Overview",
detail:`【今日目标】深入理解 LLM 的底层工作原理：Tokenization、上下文窗口、生成参数。这些不是抽象的「理论」——它们直接决定你的应用设计和成本。

【必须亲手操作的概念】
1. Tokenization——去 OpenAI Tokenizer Tool 自己试试：
   • 输入「Hello World」→ 2 tokens
   • 输入「你好世界」→ 可能是 4-6 tokens（中文 token 效率低于英文！）
   • 输入 Python 代码 → 观察代码如何被 tokenize
   → 关键认知：同样的意思，中文消耗的 Token 是英文的 1.5-3 倍
   → 这直接关系到 API 成本和 Context Window 容量

2. Token 计数实战——用 Python 算：
   uv add tiktoken
   import tiktoken
   enc = tiktoken.encoding_for_model("gpt-4o")
   text = "你的测试文本"
   tokens = enc.encode(text)
   print(f"字符数: {len(text)}, Token数: {len(tokens)}")
   print(f"平均每字符 {len(tokens)/len(text):.2f} tokens")

3. Context Window——你花的钱主要在这里：
   • GPT-4o: 128K tokens（≈ 一本 200 页的书）
   • Claude 3.5: 200K tokens（≈ 一本 300 页的书）
   • 注意：Input + Output 共享这个限制！
   • 实际可用 ≈ 标称值的 60-70%（System Prompt + 历史消息占用大量空间）

4. 生成参数——控制模型的「创造力」：
   • Temperature (0-2)：0=确定性（适合代码生成），1=有创意（适合写作），2=胡言乱语
   • Top-P (0-1)：从概率累积到 P 的 token 中采样，0.1=保守，0.9=多样
   • Max Tokens：输出最大长度，设太小会截断回答

5. System Prompt vs User Message：
   System Prompt：设定角色和行为规则（「你是一个专业的 Python 辅导老师」）
   User Message：用户的具体问题
   → System Prompt 放在对话最前面，权重最高

{topic:"Token 与成本计算：AI 应用的「计费」理解",hours:3,resource:"OpenAI Pricing 页面 + Anthropic Pricing 页面",
detail:`📦 今日需要的包：uv add tiktoken

【今日目标】掌握 Token 计数和 API 成本计算。这是 AI 应用开发中最实务的知识——不管做出多酷的功能，成本控制不了就没法上线。

【动手练习——写一个成本计算器】
1. 各模型定价（以官方价格为例，可能变动）：
   单位：美元/百万 tokens
   | 模型 | Input | Output |
   | GPT-4o-mini | $0.15 | $0.60 |
   | GPT-4o | $2.50 | $10.00 |
   | Claude Sonnet | $3.00 | $15.00 |
   | 本地 Ollama | 免费 | 免费 |

2. Token 计数函数（通用版）：
   def count_tokens(text: str, model: str = "gpt-4o") -> int:
       import tiktoken
       try:
           enc = tiktoken.encoding_for_model(model)
       except:
           enc = tiktoken.get_encoding("cl100k_base")
       return len(enc.encode(text))

3. 成本计算器：
   PRICES = {
       "gpt-4o-mini": (0.15, 0.60),
       "gpt-4o": (2.50, 10.00),
   }
   def calculate_cost(model, input_text, output_text):
       in_price, out_price = PRICES[model]
       in_tokens = count_tokens(input_text, model)
       out_tokens = count_tokens(output_text, model)
       cost = (in_tokens/1_000_000)*in_price + (out_tokens/1_000_000)*out_price
       return {"input_tokens":in_tokens, "output_tokens":out_tokens, "cost_usd":round(cost,6)}

4. 成本实战分析——算一个真实场景：
   场景：一个 RAG 问答系统，每次查询：
   • System Prompt: 500 tokens
   • 检索到的文档: 2000 tokens
   • 用户问题: 50 tokens
   • 模型输出: 300 tokens
   → 用 GPT-4o-mini：约 $0.00072/次，每天 1000 次 = $0.72
   → 用 GPT-4o：约 $0.010/次，每天 1000 次 = $10

   结论：对于生产级应用，模型选型直接决定成本。GPT-4o-mini 做简单任务，GPT-4o 做复杂任务——这就是「模型路由」模式的由来。

【今日产出】完成成本计算器代码，push 到 GitHub。写一个场景分析：你的项目 1（文档问答）如果用不同模型，月成本分别是多少？`},

detail:`【今日目标】建立机器学习的基本世界观——理解三大学习范式的定义、区别和典型应用场景。为后面每天的具体算法学习打好概念基础。

【核心概念——用你能理解的方式讲】

1. 监督学习 Supervised Learning：
   → 定义：给模型「题目+答案」让它学，学会后新题目也能预测答案
   → 类比：做练习题时有参考答案
   → 两种子类型：
     • 分类(Classification)：预测类别（垃圾邮件/正常邮件、猫/狗/鸟）
     • 回归(Regression)：预测数值（房价、温度、股票价格）
   → 你作为 Java 工程师最熟悉的概念映射：
     分类器 = 一个输入→输出的映射函数，类似你的业务 Service

2. 无监督学习 Unsupervised Learning：
   → 定义：只给数据不给答案，模型自己找规律
   → 类比：整理一堆没有标签的杂物，按形状颜色自己归类
   → 典型应用：用户分群、异常检测、数据降维

3. 强化学习 Reinforcement Learning：
   → 定义：模型在环境中尝试→获得奖励/惩罚→优化策略
   → 类比：打游戏——死了重来，逐渐学会通关
   → 与 LLM 的关系：RLHF（从人类反馈中强化学习）是 ChatGPT 成功的核心

4. 必知必会的 ML 基础术语（今天必须理解）：
   • 特征(Feature) = 输入变量 = Java POJO 的字段
   • 标签(Label) = 目标变量 = 你要预测的东西
   • 训练/验证/测试集 = 练习题/模拟考试/正式考试
   • 过拟合(Overfitting) = 死记硬背练习题，换个题就不会了
   • 欠拟合(Underfitting) = 连练习题都没学会

   )

   所有模型都用同一套 API：

   • model.fit(X, y)                # 训练
   • model.predict(X_new)           # 预测
   • model.score(X, y)              # 评估

【Java 对照】Scikit-learn 的 Estimator 接口 ≈ Java 的 Service 接口模式。统一接口意味着切换模型只需改类名，业务逻辑不变——好的设计模式跨语言通用。

{topic:"数据预处理：StandardScaler、OneHotEncoder、Pipeline",hours:3,resource:"Scikit-learn: Preprocessing 文档",
detail:`【今日目标】掌握 ML 的数据预处理核心操作。数据预处理是 ML 项目中最关键的步骤——垃圾进垃圾出。好在这一套流程非常有规律。

【动手练习——理解每一个 Transformers】
1. 数值特征标准化（StandardScaler）——让不同量纲的特征可比：
   from sklearn.preprocessing import StandardScaler
   # 问题：年龄(0-100)和收入(0-100000)数值范围差异大，模型会被大数值主导
   scaler = StandardScaler()
   X_scaled = scaler.fit_transform(X_train)  # (值 - 均值) / 标准差 → 均值为0 标准差为1
   X_test_scaled = scaler.transform(X_test)  # 注意！用训练集的参数转换测试集
   → 黄金法则：只用训练集 fit，不要用测试集 fit！否则造成数据泄露

2. 类别特征编码（OneHotEncoder）：
   from sklearn.preprocessing import OneHotEncoder
   # ['北京','上海','广州'] → [[1,0,0],[0,1,0],[0,0,1]]
   # 原因：模型只能理解数字，不能理解字符串

3. 数值特征 + 类别特征混合预处理——ColumnTransformer：
   from sklearn.compose import ColumnTransformer
   preprocessor = ColumnTransformer([
       ('num', StandardScaler(), ['age', 'income']),
       ('cat', OneHotEncoder(), ['city', 'gender'])
   ])

4. Pipeline——串联预处理和模型（ML 项目的最佳实践）：
   from sklearn.pipeline import Pipeline
   pipeline = Pipeline([
       ('preprocessor', preprocessor),
       ('classifier', LogisticRegression())
   ])
   pipeline.fit(X_train, y_train)
   pipeline.score(X_test, y_test)
   → Pipeline 确保预处理步骤和模型训练一体，避免数据泄露

5. 交叉验证——更可靠的评估：
   from sklearn.model_selection import cross_val_score
   scores = cross_val_score(pipeline, X, y, cv=5)  # 5折交叉验证
   print(f"5折CV平均准确率: {scores.mean():.2%} (±{scores.std():.2%})")

【今日产出】用 Pipeline 重建 Iris 分类流程（加预处理+交叉验证），push 到 GitHub。`},
{topic:"分类算法全家桶：Logistic Regression、决策树、随机森林、SVM、KNN",hours:3,resource:"Scikit-learn: Classification 文档",
detail:`【今日目标】在同一次数据上跑 5 种不同的分类算法，对比效果。理解「没有免费的午餐」——没有一个算法在所有问题上都是最好的。

【动手练习——建一个分类器对比脚本】
1. 准备一个稍微复杂的数据集（breast_cancer 或 digits）：
   from sklearn.datasets import load_breast_cancer
   data = load_breast_cancer()
   X, y = data.data, data.target

2. 定义要对比的 5 个分类器：
   from sklearn.linear_model import LogisticRegression
   from sklearn.tree import DecisionTreeClassifier
   from sklearn.ensemble import RandomForestClassifier
   from sklearn.svm import SVC
   from sklearn.neighbors import KNeighborsClassifier

   classifiers = {
       "逻辑回归": LogisticRegression(max_iter=2000),
       "决策树": DecisionTreeClassifier(max_depth=5),
       "随机森林": RandomForestClassifier(n_estimators=100),
       "SVM": SVC(kernel='rbf'),
       "KNN": KNeighborsClassifier(n_neighbors=5),
   }

3. 训练+评估循环：
   for name, clf in classifiers.items():
       clf.fit(X_train, y_train)
       train_score = clf.score(X_train, y_train)
       test_score = clf.score(X_test, y_test)
       print(f"{name}: 训练集={train_score:.3f} 测试集={test_score:.3f}")

4. 分析结果——训练集/测试集差距越大 = 越过拟合：
   • 决策树容易过拟合（训练集 100% 但测试集低）
   • 随机森林通常最稳定（集成学习减少过拟合）
   • SVM 在小数据上表现好但数据量大时慢
   • KNN 需要特征标准化否则距离计算没意义

5. 每个算法的直观理解（面试常考）：
   • 逻辑回归 = 在线性模型上加 sigmoid 变成概率 → 最简单的分类器
   • 决策树 = If-else 规则树 → 最直观，但容易过拟合
   • 随机森林 = 造 N 棵决策树投票 → 减少方差、更稳定
   • SVM = 找到最大间隔的分割线 → 数学优美但不适合大数据
   • KNN = 看离你最近的 K 个邻居是什么类别 → 不需要训练但预测慢

【今日产出】完成 5 分类器对比脚本，输出对比表格。选一个算法用通俗语言写一段解释（假设你是面试官问「随机森林是什么」）。`},

   # LinearRegression: 基础线性回归
   # Ridge: L2 正则化（防止过拟合）——最常用
   # Lasso: L1 正则化（自动特征选择，不重要的特征系数变0）

3. 回归评估指标——和分类完全不同：
   from sklearn.metrics import mean_squared_error, mean_absolute_error, r2_score
   # MSE: 均方误差（放大离群值影响）
   # MAE: 平均绝对误差（直观，预测值和真实值的平均差距）
   # R²: 决定系数（0-1，越接近1越好，0=不如直接猜均值）

【动手练习——聚类篇】
4. K-Means 聚类——最常用的无监督算法：
   from sklearn.cluster import KMeans
   kmeans = KMeans(n_clusters=3, random_state=42)
   kmeans.fit(X)
   labels = kmeans.labels_               # 每个样本属于哪个簇
   centers = kmeans.cluster_centers_     # 每个簇的中心点

5. 如何选 K（簇的数量）——Elbow Method：
   inertias = []
   for k in range(1, 11):
       kmeans = KMeans(n_clusters=k)
       kmeans.fit(X)
       inertias.append(kmeans.inertia_)
   # 画图找「肘部」——拐点就是最佳 K

6. DBSCAN——发现任意形状的簇，还能检测异常点：
   与 K-Means 的区别：不需要指定簇数、能发现不规则形状、自动标记离群点

【今日产出】完成回归模型对比（Linear/Ridge/Lasso）+ K-Means 聚类 + Elbow Method 可视化。push 到 GitHub。`},
{topic:"模型评估全流程：混淆矩阵、ROC/AUC、GridSearch 调参",hours:3,resource:"Scikit-learn: Model Selection 文档",
detail:`【今日目标】掌握 ML 模型评估的完整方法论。训练模型不难，难的是知道模型到底好不好、哪里不好、怎么改进。

【动手练习——每项评估都要实战】
1. 混淆矩阵——分类问题的「显微镜」：
   from sklearn.metrics import confusion_matrix, ConfusionMatrixDisplay
   cm = confusion_matrix(y_test, y_pred)
   # 看 4 个格子：
   # 左上(TP)=真正例, 右上(FP)=假正例, 左下(FN)=假反例, 右下(TN)=真反例
   # 业务意义：FP 是把正常的标记为异常（误报），FN 是把异常的漏掉（漏报）
   # 哪个更严重取决于场景——癌症检测宁可误报也不漏报（降低 FN）

2. 分类报告——一张表覆盖所有指标：
   print(classification_report(y_test, y_pred))
   # Precision(精确率) = TP/(TP+FP) —— 你说是正类的，有多少真的对？
   # Recall(召回率) = TP/(TP+FN) —— 所有真的正类，你找出了几个？
   # F1-score = Precision 和 Recall 的调和平均

3. ROC 曲线与 AUC——二分类问题的标准评估：
   from sklearn.metrics import roc_curve, roc_auc_score
   y_proba = model.predict_proba(X_test)[:,1]  # 获取概率而非硬分类
   # AUC = 1.0 → 完美分类器；AUC = 0.5 → 随机猜测

4. GridSearchCV——自动找最优超参数：
   from sklearn.model_selection import GridSearchCV
   param_grid = {
       'classifier__C': [0.1, 1, 10],           # 正则化强度
       'classifier__solver': ['liblinear','lbfgs']
   }
   grid = GridSearchCV(pipeline, param_grid, cv=5)
   grid.fit(X_train, y_train)
   print(f"最佳参数: {grid.best_params_}")
   print(f"最佳CV分数: {grid.best_score_:.3f}")

5. 学习曲线——诊断过拟合/欠拟合：
   from sklearn.model_selection import learning_curve
   # 横轴=训练样本数，纵轴=分数
   # 训练集和验证集差距大 → 过拟合 → 加数据/加正则化/简化模型
   # 两条线都很低 → 欠拟合 → 换更强的模型/加特征

【今日产出】对 Iris 数据集做完整的评估流程（混淆矩阵+分类报告+ROC+GridSearch+学习曲线），输出一份评估报告。`},

{title:"第 6 周：神经网络基础 + PyTorch 入门",days:[
{topic:"神经网络直觉：感知机 → MLP → 为什么需要深度学习",hours:3,resource:"3Blue1Brown: Neural Networks (YouTube 3集) + TensorFlow Playground",
detail:`【今日目标】建立对神经网络的基本直觉——不需要公式推导，但要理解「为什么层数越多模型越强」。3Blue1Brown 的视频是最佳的神经网络入门材料。

【核心概念——直观理解】
1. 感知机（Perceptron）——神经网络的原子单元：
   → 输入向量 × 权重 + 偏置 → 激活函数 → 输出
   → 数学：y = activation(w₁x₁ + w₂x₂ + ... + b)
   → 一个感知机 = 一条决策线（线性分类器）

2. 多层感知机（MLP）——堆叠感知机：
   → 输入层 → 隐藏层1 → 隐藏层2 → ... → 输出层
   → 层与层之间全连接（每个神经元连到下一层所有神经元）
   → 为什么需要多层？单层只能解决线性可分问题（画一条线分开两类）
     多层可以解决任意复杂问题（画曲线、圈、各种形状的边界）

3. 激活函数——引入非线性（没有它多层等于单层）：
   • ReLU: max(0, x) → 最常用，简单高效，解决梯度消失
   • Sigmoid: 1/(1+e^(-x)) → 输出 0~1，适合二分类输出层
   • Tanh: → 输出 -1~1，以 0 为中心
   • Softmax: → 多分类输出层，输出各类概率

4. 去 TensorFlow Playground 手动操作（最重要的一步！）：
   https://playground.tensorflow.org
   • 选螺旋数据（最难的分布）
   • 先用 1 层 1 神经元 → 无法分开
   • 加到 3 层各 4 神经元 → 能分开了！
   • 尝试不同激活函数 → 观察 ReLU 和 Tanh 的区别
   → 这个操作用眼睛看一遍胜过读十遍理论

【今日产出】在 TensorFlow Playground 上截图 5 种不同配置的训练结果。写一段总结：「为什么加深网络能解决更复杂的问题？」`},
{topic:"反向传播与梯度下降：神经网络学习的数学直觉",hours:3,resource:"Karpathy: micrograd (YouTube) + 3Blue1Brown: Gradient Descent",
detail:`【今日目标】理解神经网络是怎么「学习」的。反向传播(Backpropagation)是深度学习最重要的算法——但你要理解的是直觉而非公式推导。

【核心直觉——用类比理解】
1. 损失函数——衡量「模型的预测有多烂」：
   → 等价于 Java 单元测试的断言失败程度
   → MSE（回归）：预测值和真实值差多少
   → Cross-Entropy（分类）：预测的概率分布和真实的概率分布差多少
   → 训练目标 = 最小化损失函数

2. 梯度下降——找最低点的登山法：
   → 想象你在雾中下山，踩一脚感觉地形，往最陡的下坡方向走一步
   → 梯度 = 最陡的下坡方向，学习率 = 每步多大
   → 学习率太大：跳过了最低点→震荡；学习率太小：下山太慢
   → 这一步在 Java 里就是你调 JVM GC 参数时的直觉——先把步长调大快速定位，再调小精细搜索

3. 反向传播——把误差从输出层传回输入层：
   → 前向传播：输入→隐藏层→输出→计算损失
   → 反向传播：损失→对每个权重求偏导数（链式法则）→用梯度更新权重
   → 每一层都得到信号：「你应该往哪个方向调、调多少」

4. 手动模拟一次梯度下降（用 NumPy，不调库）：
   目标：找到 y = x² 的最小值（显然在 x=0）
   x = 5.0; lr = 0.1
   for step in range(50):
       grad = 2*x            # y=x² 的导数 = 2x
       x = x - lr * grad     # 沿梯度的反方向走
       print(f"Step {step}: x={x:.4f}, y={x**2:.4f}")
   → x 从 5 逐步逼近 0！这就是梯度下降

5. 看 Karpathy 的 micrograd 视频（如果时间不够，看前 30 分钟）：
   Andrej Karpathy 从零实现一个自动微分引擎，代码不到 200 行。
   → 这是你能找到的最好的反向传播教学，没有之一。

【今日产出】用 NumPy 实现一个单神经元的梯度下降训练（解决 y=mx+b 的线性回归）。记录每一步的 loss 变化并画图。`},
{topic:"PyTorch 基础 (一)：Tensor 与 Autograd——PyTorch 的双核心",hours:3,resource:"PyTorch 官方 60min Blitz 前半部分",
detail:`📦 今日需要的包：uv add torch torchvision

【今日目标】掌握 PyTorch 的两大核心：Tensor（数据容器，对标 NumPy ndarray + GPU 支持）和 Autograd（自动求导，对标手动写梯度）。

【动手练习——每个操作都在 Jupyter 里跑】
1. 安装 PyTorch：
   uv add torch torchvision

2. Tensor 操作——和 NumPy 几乎一样，但多了 GPU 支持：
   import torch
   a = torch.tensor([1,2,3,4,5])
   b = torch.zeros(3,4)
   c = torch.randn(2,3)           # 标准正态分布
   d = torch.arange(0,10,0.5)

   # Tensor ←→ NumPy 互转（无缝衔接！）
   a_np = a.numpy()
   a_back = torch.from_numpy(a_np)

   # GPU 操作（如果有 GPU）：
   if torch.cuda.is_available():
       device = torch.device("cuda")
       a_gpu = a.to(device)       # 搬到 GPU
       result = a_gpu * 2
       print(result.device)       # cuda:0

3. Autograd——PyTorch 最核心的特性，让你不再手动求导：
   x = torch.tensor([3.0], requires_grad=True)  # 告诉 PyTorch 跟踪这个变量
   y = x**3 + 2*x**2 + x                        # y = x³+2x²+x
   y.backward()                                  # 自动计算 dy/dx
   print(x.grad)                                 # grad = 3x²+4x+1, x=3 → 40

   # 对比之前手动算导数的痛苦：
   # 手动：背公式→推导数→写代码→检查是否算错
   # PyTorch：requires_grad=True → backward() → .grad → 完事

4. 用 Autograd 做一次梯度下降：
   w = torch.randn(1, requires_grad=True)
   b = torch.randn(1, requires_grad=True)
   for epoch in range(100):
       y_pred = w * X + b
       loss = ((y_pred - y_true)**2).mean()
       loss.backward()
       with torch.no_grad():         # 暂时关闭梯度跟踪
           w -= 0.01 * w.grad
           b -= 0.01 * b.grad
       w.grad.zero_(); b.grad.zero_()  # 清空梯度

【Java 对照】PyTorch Tensor ≈ Java double[][] 但支持 GPU 和自动求导。PyTorch Autograd ≈ 你写的所有求导代码被自动生成了。

【今日产出】用 PyTorch Tensor + Autograd 完成一次线性回归训练（对比 NumPy 手写梯度下降版本）。push 到 GitHub。`},
{topic:"PyTorch 基础 (二)：nn.Module、DataLoader、训练循环模板",hours:3,resource:"PyTorch 官方 Tutorial: Build the Neural Network",
detail:`【今日目标】掌握 PyTorch 构建神经网络的标准组件——nn.Module（模型定义）、DataLoader（数据加载）、训练循环（标准模板）。建立你的 PyTorch 项目骨架。

【动手练习——搭建标准 PyTorch 项目】
1. 用 nn.Module 定义模型——对标 Java 的 class 定义：
   import torch.nn as nn
   class SimpleNN(nn.Module):
       def __init__(self, input_dim, hidden_dim, output_dim):
           super().__init__()
           self.fc1 = nn.Linear(input_dim, hidden_dim)   # 全连接层
           self.relu = nn.ReLU()                          # 激活函数
           self.fc2 = nn.Linear(hidden_dim, output_dim)

       def forward(self, x):     # 定义前向传播——像写 Java 方法一样
           x = self.fc1(x)
           x = self.relu(x)
           x = self.fc2(x)
           return x

2. DataLoader——批量加载数据（对标 Java 的分页查询）：
   from torch.utils.data import DataLoader, TensorDataset
   dataset = TensorDataset(X_tensor, y_tensor)
   dataloader = DataLoader(dataset, batch_size=32, shuffle=True)
   # batch_size=32: 每次加载 32 条数据一起计算（GPU 并行优势）
   # shuffle=True: 每轮打乱数据（防止模型记住顺序）

3. 标准训练循环模板——以后每个 PyTorch 项目都用这个骨架：
   model = SimpleNN(4, 16, 3)   # Iris: 4特征→16隐藏→3类
   criterion = nn.CrossEntropyLoss()
   optimizer = torch.optim.Adam(model.parameters(), lr=0.01)

   for epoch in range(100):
       model.train()
       for X_batch, y_batch in dataloader:
           optimizer.zero_grad()           # 1. 清空梯度
           outputs = model(X_batch)        # 2. 前向传播
           loss = criterion(outputs, y_batch)  # 3. 计算损失
           loss.backward()                 # 4. 反向传播
           optimizer.step()                # 5. 更新权重

       # 验证（不计算梯度，加速+省内存）
       model.eval()
       with torch.no_grad():
           val_outputs = model(X_val)
           val_loss = criterion(val_outputs, y_val)
           _, predicted = torch.max(val_outputs, 1)
           acc = (predicted == y_val).float().mean()

       if epoch % 10 == 0:
           print(f"Epoch {epoch}: train_loss={loss:.4f}, val_acc={acc:.3f}")

【今日产出】用 PyTorch nn.Module 在 Iris 数据集上训练一个 MLP 分类器，对比 Scikit-learn 版本的效果。总结 PyTorch 和 Scikit-learn 的使用场景差异。`},
{topic:"训练循环实战：CNN on MNIST——你的第一个深度学习模型",hours:3,resource:"PyTorch: Training a Classifier + CIFAR-10 Tutorial",
detail:`【今日目标】在 MNIST（手写数字识别，ML 界的 Hello World）上训练一个 CNN。这是你第一次真正跑一个深度学习模型。

【动手练习——完整 CNN 训练】
1. 加载 MNIST 数据集（PyTorch 内置）：
   from torchvision import datasets, transforms
   transform = transforms.Compose([
       transforms.ToTensor(),
       transforms.Normalize((0.1307,), (0.3081,))  # MNIST 的均值和标准差
   ])
   train_data = datasets.MNIST('./data', train=True, download=True, transform=transform)
   test_data = datasets.MNIST('./data', train=False, transform=transform)
   train_loader = DataLoader(train_data, batch_size=64, shuffle=True)

2. 定义 CNN（用两个卷积层）：
   class CNN(nn.Module):
       def __init__(self):
           super().__init__()
           self.conv1 = nn.Conv2d(1, 32, 3, 1)    # 输入1通道(灰度)，输出32通道
           self.conv2 = nn.Conv2d(32, 64, 3, 1)
           self.fc1 = nn.Linear(9216, 128)         # 全连接层做分类
           self.fc2 = nn.Linear(128, 10)           # 10个数字类别
           self.dropout = nn.Dropout(0.5)

       def forward(self, x):
           x = torch.relu(self.conv1(x))
           x = torch.relu(self.conv2(x))
           x = torch.max_pool2d(x, 2)              # 下采样
           x = torch.flatten(x, 1)                 # 展开成一维
           x = torch.relu(self.fc1(x))
           x = self.dropout(x)                     # 防止过拟合
           x = self.fc2(x)
           return x

3. 训练并观看 loss 下降：
   for epoch in range(5):  # 5 轮就够了，MNIST 简单
       ...
   # 你会在几分钟内看到准确率从 ~10% 攀升到 ~98%

       sample = next(iter(test_loader))
       images, labels = sample
       outputs = model(images)
       _, preds = torch.max(outputs, 1)

   from torch.cuda.amp import autocast, GradScaler

{title:"第 7 周：经典模型架构深入",days:[
{topic:"CNN 深入：从 LeNet 到 ResNet——架构演进史",hours:3,resource:"d2l.ai: Modern CNN Architectures + CNN Explainer",
detail:`【今日目标】理解 CNN 架构的发展脉络，掌握迁移学习——用预训练模型解决新任务。这是你在实际项目中 99% 会用到的方法（而不是从零训练）。

【CNN 架构演进——看懂这条线就全通了】
1. LeNet-5 (1998)：最原始的 CNN，5 层
2. AlexNet (2012)：ImageNet 冠军，首次证明深度 CNN + GPU 的威力
3. VGG (2014)：用 3×3 小卷积核堆叠，证明深度比宽度重要
4. ResNet (2015)：残差连接——打破深度限制（152 层还能训！）
   → 「跳连」(skip connection)：输入直接加到几层后的输出
   → 解决了梯度消失问题：梯度可以通过 skip connection 直通初始层
5. 后续：DenseNet / EfficientNet / ConvNeXt

【关键理解——迁移学习】
→ 问题：CIFAR-10 只有 5 万张图，从零训练大型 CNN 难以达到高精度
→ 解法：用 ImageNet 上预训练好的 ResNet-50，改掉最后一层适配 CIFAR-10
→ 类比：一个医生（预训练模型）已经有了医学基础，你只需要培训他认你的 X 光片

【动手练习——迁移学习实战】
from torchvision import models
model = models.resnet18(pretrained=True)  # 下载预训练权重！
# 冻结所有层（不让它们被更新）
for param in model.parameters():
    param.requires_grad = False
# 替换最后一层（ImageNet有1000类，CIFAR-10只有10类）
model.fc = nn.Linear(model.fc.in_features, 10)
# 只训练最后一层 → 收敛快、效果好、不易过拟合

【今日产出】用迁移学习在 CIFAR-10 上达到 90%+ 准确率，对比从零训练版本的效果和训练时间。`},
{topic:"RNN/LSTM：序列建模——文本、时间序列、语音",hours:3,resource:"Colah's Blog: Understanding LSTM Networks + d2l.ai: RNN",
detail:`【今日目标】理解循环神经网络(RNN)和 LSTM——学会处理序列数据。虽然 Transformer 现在是主流，但理解 RNN/LSTM 的演进逻辑是理解 Transformer 的前提。

【核心概念——序列的挑战】
1. 为什么 CNN 不能处理序列？
   → CNN 假设输入之间是独立的（图片各区域没有顺序依赖）
   → 但句子「我爱你」和「你爱我」意思完全不同——顺序至关重要！

2. RNN 的核心思想——循环：
   → 隐藏状态 h_t 既接受当前输入 x_t，也接受上一时刻的 h_{t-1}
   → 一个 for 循环：每次迭代更新隐藏状态，最后一个状态包含了整个序列的信息
   → 问题：梯度消失——长序列中，较早的信息对梯度的贡献指数级衰减

3. LSTM——给 RNN 加「门控机制」：
   → 遗忘门：决定丢掉哪些旧信息
   → 输入门：决定记住哪些新信息
   → 输出门：决定输出什么
   → 类比：读文章时，你会自动忽略不重要的句子，记住关键信息
   → 这三个门让 LSTM 能处理更长序列（几十到几百步）

4. GRU——LSTM 的简化版：
   → 只有两个门（重置门+更新门），参数更少
   → 效果通常和 LSTM 相当，但训练更快

【动手练习——LSTM 文本分类】
用 LSTM 做 IMDb 影评情感分析（正面/负面）：
import torch.nn as nn
class LSTMClassifier(nn.Module):
    def __init__(self, vocab_size, embed_dim, hidden_dim):
        super().__init__()
        self.embedding = nn.Embedding(vocab_size, embed_dim)  # 词嵌入层
        self.lstm = nn.LSTM(embed_dim, hidden_dim, batch_first=True)
        self.fc = nn.Linear(hidden_dim, 2)   # 正面/负面
    def forward(self, x):
        x = self.embedding(x)
        _, (hidden, _) = self.lstm(x)        # 取最后时刻的隐藏状态
        return self.fc(hidden.squeeze(0))

【今日产出】完成 LSTM IMDb 情感分析，准确率 > 85%。画一张图解释 LSTM 的三个门是如何工作的。`},
{topic:"Transformer 精讲 (一)：Self-Attention——AI 时代最重要的架构",hours:3,resource:"《Attention Is All You Need》论文 + The Illustrated Transformer (Jalammar)",
detail:`【今日目标】理解 Self-Attention 机制——这是 Transformer 的核心，也是后续 GPT/BERT/Claude 等所有大模型的基石。花 3 小时理解它，后面省 300 小时。

【Self-Attention 直觉——用查字典类比】
想象你读一句话：「猫追老鼠，它跑得很快。」
问：「它」指的是谁？人会自动注意到「它」和「猫」的关系（注意更多）。

Self-Attention 就是让模型学会这个能力——每个词看句子中所有其他词，决定给每个词分配多少「注意力」权重。

【公式拆解——不要怕，一步步来】
1. 每个词通过三个矩阵映射为三个向量：
   • Q (Query, 查询)：我要找什么？——相当于搜索引擎的搜索词
   • K (Key, 键)：我有什么？——相当于文章的关键词标签
   • V (Value, 值)：我具体是什么？——相当于文章的内容
   → 类比：你去图书馆找书(Q)→看每本书的标签(K)匹配度→根据匹配度提取内容(V)

2. Attention 的 4 步计算：
   (1) Score = Q·K^T            → 「我的查询」和「你的标签」匹配程度
   (2) Score = Score / √d_k     → 缩放，防止点积太大导致 softmax 梯度消失
   (3) Weights = softmax(Score) → 把得分转成概率分布（总和为 1）
   (4) Output = Weights·V       → 按权重加权汇总所有 Value

   最终公式：Attention(Q,K,V) = softmax(QK^T/√d_k)V

3. 可视化理解——去看 The Illustrated Transformer：
   • 一句话里每个词对其他所有词的注意力权重
   • 主语和谓语之间权重高
   • 代词和指代对象之间权重高
   → 这就是所谓的「上下文理解」——本质上是注意力权重的分配

【Multi-Head Attention】
→ 不是做一次 Attention，而是并行做 8/16/32 次
→ 不同的「头」关注不同的关系：语法关系、语义关系、位置关系
→ 类比：一个团队里有 8 个人同时看同一句话，每个人关注不同的方面，最后综合意见

【今日产出】手算一个简单的 Attention 示例（3 个词 × 2 维向量，Q/K/V 手动赋值），一步步写出 Attention 矩阵的数值变化。然后用 PyTorch 验证。`},
{topic:"Transformer 精讲 (二)：完整架构 + Positional Encoding",hours:3,resource:"Karpathy: Let's build GPT from scratch (YouTube) + The Annotated Transformer",
detail:`【今日目标】理解 Transformer 的完整架构。昨天学了 Self-Attention 这最关键的一半，今天补完剩余组件：Positional Encoding、Feed-Forward、Layer Normalization、Residual Connection。

【Transformer 的 5 个组件——逐一攻破】
1. Positional Encoding——解决「没有位置信息」的问题：
   → Self-Attention 本身是「无序」的——「我爱你」和「你爱我」的 Attention 相同（都会注意到词对之间的关系）
   → Positional Encoding = 给每个位置编码一个独特的向量，加到词向量上
   → 正弦编码方案：sin/cos 函数生成，不同频率覆盖不同粒度
   → 效果：位置相近的词编码也相近，模型就能感知顺序

2. Feed-Forward Network (FFN)——每个位置的独立处理：
   → 两层全连接：Linear → ReLU → Linear
   → Self-Attention 负责「与所有位置交互」，FFN 负责「对每个位置独立变换」
   → 类比：开会讨论(Self-Attention) → 每个人回去独自整理笔记(FFN)

3. Layer Normalization——稳定训练：
   → 对每个样本的特征维度做标准化
   → 对比 Batch Normalization：BN 对一批样本的同一特征做标准化
   → 为什么用 LN？序列长度不一，BN 不稳定；LN 不依赖 batch size

4. Residual Connection——让深层模型能训练：
   → output = LayerNorm(x + SubLayer(x))
   → 如果 SubLayer 学不到东西，起码还能传递原始信息
   → 这就是 ResNet 的核心思想，Transformer 也用上了

【完整数据流——在脑子里跑一遍】
输入句子「我 爱 AI」
→ Token Embedding (每个词→768维向量)
→ + Positional Encoding (加上位置信息)
→ Multi-Head Self-Attention (词之间交互)
→ + Residual → LN
→ Feed-Forward Network (每个词独立处理)
→ + Residual → LN
→ 输出 → 下一个 Transformer Block 或最后的分类/生成层

【今日产出】画一张完整的 Transformer 架构图（用 draw.io 或手绘），标注每个组件的数据维度变化。输入 3 个词 × 768 维，追踪每一层的 shape 变化。`},
{topic:"从零实现 Mini GPT：用代码理解 Transformer",hours:3,resource:"Karpathy: nanoGPT (GitHub) + The Annotated Transformer",
detail:`【今日目标】跟着 Andrej Karpathy 的视频，从零实现一个基于 Transformer 的字符级语言模型。不是会背公式就行——写一遍才能真正理解。

【动手练习——从头写一个 Mini GPT】
参考 Karpathy 的 nanoGPT/nanoGPT，在字符级别上训练一个小型 GPT：
1. 数据集：莎士比亚全集（或任何小文本）
2. 模型：4-6 层 Decoder-Only Transformer
3. 任务：给定前面的字符，预测下一个字符
4. 规模：1000 万参数左右（在笔记本电脑上能跑）

【关键代码结构】
class MiniGPT(nn.Module):
    def __init__(self, vocab_size, n_embd, n_head, n_layer, block_size):
        self.token_embedding = nn.Embedding(vocab_size, n_embd)
        self.position_embedding = nn.Embedding(block_size, n_embd)
        self.blocks = nn.Sequential(*[TransformerBlock(n_embd, n_head) for _ in range(n_layer)])
        self.ln_f = nn.LayerNorm(n_embd)
        self.lm_head = nn.Linear(n_embd, vocab_size)  # 预测下一个 token

    def forward(self, idx):
        B, T = idx.shape
        tok_emb = self.token_embedding(idx)           # (B,T,C)
        pos_emb = self.position_embedding(torch.arange(T))
        x = tok_emb + pos_emb
        x = self.blocks(x)
        x = self.ln_f(x)
        logits = self.lm_head(x)                      # (B,T,vocab_size)
        return logits

【理解关键点】
• Causal Mask：只看当前位置及之前的内容（不能偷看后面的），用一个上三角 mask 实现
• Cross-Entropy Loss：和分类问题一样——预测下一个 token 本质上就是一个 vocab_size 分类问题
• 生成过程：输入初始文本→预测下一个 token→拼接到输入→再预测→...→自回归循环

【今日产出】跑通 Mini GPT 训练，生成一些文本样本。观察不同训练阶段的输出——从乱码到大写字母到有意义的单词。`},
{topic:"Attention 可视化：看模型到底关注什么",hours:3,resource:"BertViz 工具 + Hugging Face Transformers",
detail:`📦 今日需要的包：uv add bertviz

【今日目标】加载预训练模型，提取并可视化 Attention 权重。看到模型「关注什么」比看论文直观得多——这是建立深层理解的关键一步。

{topic:"Transformers 库核心：AutoModel + Tokenizer 深入",hours:3,resource:"Hugging Face Course 第3-4章",
detail:`【今日目标】深入理解 Hugging Face Transformers 库的两个核心组件：AutoModel（自动加载模型）和 AutoTokenizer（分词器）。

【动手练习——拆解 pipeline 的内部步骤】
1. Tokenizer——理解分词全过程：
   from transformers import AutoTokenizer
   tokenizer = AutoTokenizer.from_pretrained("bert-base-uncased")
   text = "Hello, how are you?"
   tokens = tokenizer.tokenize(text)   # → ['hello', ',', 'how', 'are', 'you', '?']
   ids = tokenizer.encode(text)        # → token IDs
   decoded = tokenizer.decode(ids)     # → 还原（注意大小写和空格变化！）

   # 批处理——AI 场景的标准操作
   texts = ["Hello world", "How are you"]
   batch = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")
   # padding=True: 把短句补到和最长的一样（加 [PAD]）
   # truncation=True: 超过最大长度的截断
   # return_tensors="pt": 返回 PyTorch tensors
   print(batch["input_ids"].shape)     # (2, max_length)

2. AutoModel——统一接口加载任何模型：
   from transformers import AutoModel
   model = AutoModel.from_pretrained("bert-base-uncased")
   outputs = model(**batch)
   # outputs.last_hidden_state: (batch_size, seq_len, hidden_dim)
   # outputs.pooler_output: 句子的聚合表示

3. 不同任务对应的模型类型：
   • AutoModel → 基础模型（只出 hidden states）
   • AutoModelForSequenceClassification → 文本分类（hugging face 最常见）
   • AutoModelForTokenClassification → 序列标注（NER）
   • AutoModelForQuestionAnswering → 问答

detail:`【今日目标】跑通完整的微调流程——用 Hugging Face Trainer API 微调 BERT 做中文文本分类。这是你第一次真正「改变一个预训练模型的行为」。

【完整流程——每一步都自己写】
1. 准备中文分类数据集（用公开数据集或自己构造）：
   # 模拟一个二分类数据集——商品评论情感分析
   data = {
       "text": [
           "这个东西质量很好，用起来很舒服",
           "太差了，买回来就坏了，客服态度也不好",
           "一般般吧，不值这个价钱",
           ...

       "label": [1, 0, 0, ...]  # 1=正面, 0=负面
   }

2. 数据预处理：
   from transformers import AutoTokenizer
   tokenizer = AutoTokenizer.from_pretrained("bert-base-chinese")
   def tokenize_function(examples):
       return tokenizer(examples["text"], padding="max_length", truncation=True, max_length=128)

   from datasets import Dataset
   dataset = Dataset.from_dict(data)
   tokenized_dataset = dataset.map(tokenize_function, batched=True)

3. 加载模型：
   from transformers import AutoModelForSequenceClassification
   model = AutoModelForSequenceClassification.from_pretrained(
       "bert-base-chinese", num_labels=2
   )

4. 配置训练参数并训练：
   from transformers import TrainingArguments, Trainer
   training_args = TrainingArguments(
       output_dir="./results",
       num_train_epochs=3,
       per_device_train_batch_size=8,
       evaluation_strategy="epoch",
       save_strategy="epoch",
   )
   trainer = Trainer(
       model=model,
       args=training_args,
       train_dataset=tokenized_dataset,
   )
   trainer.train()

【关键理解】微调的本质：模型 99% 的权重不变（来自预训练），只微调最后几层和分类头。这比从零训练快 100 倍且效果好得多。

{topic:"GPT 系列演进：GPT-1→2→3→4 的范式转变",hours:3,resource:"GPT 系列论文 + Lil'Log: The GPT Series",
detail:`【今日目标】理解 GPT 系列的发展脉络和每次迭代的关键创新。你不知道 GPT-1/2/3 之间的区别，就没法真正理解为什么 GPT-4 这么强。

【GPT 进化史——每次迭代的关键突破】
GPT-1 (2018): "预训练+微调"范式——用海量无标注文本预训练，再在具体任务上微调。证明了 Transformer Decoder 可以做语言模型。

GPT-2 (2019): "Zero-shot"——不做微调，直接用预训练模型做下游任务。核心发现：足够大的语言模型自己就「理解」了任务，不需要专门训练。数据+参数量 = 能力涌现。

GPT-3 (2020): "In-Context Learning"——在 Prompt 里给几个例子，模型就能学会新任务。1750亿参数。提出「Scaling Law」：模型越大，能力越强。但 GPT-3 也经常胡说八道、不遵循指令。

InstructGPT / ChatGPT (2022): "RLHF"——加入人类反馈强化学习，让模型变得「听话」。这是最关键的转折：GPT-3 很强但不听话，ChatGPT 既强又听话。技术上：SFT(指令微调)+Reward Model+PPO(强化学习)。

GPT-4 (2023): 多模态 + 更强的推理。细节未完全公开，但核心推测：更大规模 + 更好的数据 + MoE(混合专家)架构。

【动手练习】

→ 对比回答的深度、准确性、结构——感受 Scaling 的威力

{topic:"Decoder-Only 为什么赢了？Causal LM vs MLM",hours:3,resource:"Hugging Face: Causal LM vs Masked LM + 相关论文",
detail:`【今日目标】理解为什么 GPT 的 Decoder-Only 架构成为了 LLM 的主流选择。BERT 当年也很火（Encoder-Only），为什么现在没人用了？

【三种架构对比——面试高频题】
1. Encoder-Only (BERT 类)：
   → 双向注意力——每个词能看到整句话的所有词（前后都看）
   → 擅长：理解任务（分类/NER/问答）
   → 问题：不能做生成（因为看不到后面的词怎么预测下一个？）
   → 现状：被 GPT 类模型取代，但仍在某些理解任务中使用

2. Decoder-Only (GPT 类)：
   → 单向注意力（Causal Mask）——每个词只能看到前面的词
   → 擅长：文本生成（这是当前 AI 应用的核心需求）
   → 优势：训练简单——预测下一个 token 这个任务天然适合自监督学习
   → 关键发现：足够大的 Decoder-Only 模型连理解任务也能做（GPT-4 的分类能力超过 BERT）

3. Encoder-Decoder (T5/BART 类)：
   → Encoder 先理解输入，Decoder 再生成输出
   → 擅长：翻译、摘要（输入和输出长度不同的任务）
   → 问题：参数量翻倍（两套模型），效率不如纯 Decoder
   → 现状：被 GPT 类模型覆盖

【关键理解——Causal Attention Mask】
用代码直观感受：
mask = torch.triu(torch.ones(5,5)*float('-inf'), diagonal=1)
# [[0, -inf, -inf, -inf, -inf],
#  [0,   0,  -inf, -inf, -inf],
#  [0,   0,    0,  -inf, -inf],
#  [0,   0,    0,    0,  -inf],
#  [0,   0,    0,    0,    0 ]]
→ 第 i 行第 j 列如果为 -inf，则 token i 不能关注 token j
→ 每个 token 只能看自己及之前的 token

【今日产出】写一段代码对比 Encoder 和 Decoder 的 Attention Mask 差异。画图解释为什么 Decoder-Only 是 LLM 的最优选择。`},
{topic:"Tokenization 深入：BPE 算法 + 中文分词坑",hours:3,resource:"Hugging Face: Tokenizer Summary + OpenAI Tokenizer Tool",
detail:`【今日目标】深入理解 Tokenization——LLM 的「第一层」。Tokenizer 的好坏直接影响模型效果和成本。中文 Tokenization 有很多独特的坑需要了解。

【动手练习——玩转 Tokenizer】
1. BPE (Byte-Pair Encoding) 算法原理：
   → 从字符级开始，统计最常一起出现的字符对，合并成一个新 token
   → 反复合并直到达到目标词表大小（如 50000）
   → 结果：常见词→一个 token，罕见词→拆成多个 token

2. 不同 Tokenizer 对比——用同一个文本看结果：
   from transformers import AutoTokenizer
   text = "Transformers are changing the world of NLP. 大语言模型正在改变世界。"

   for name in ["gpt2","bert-base-uncased","bert-base-chinese","Qwen/Qwen-7B"]:
       tok = AutoTokenizer.from_pretrained(name)
       tokens = tok.tokenize(text)
       print(f"{name}: {len(tokens)} tokens → {tokens}")

3. 中文 Tokenization 的坑——你作为中文开发者必须知道：
   • BERT 中文版：按字切分，每个汉字一个 token
   • Qwen/Llama 中文：BPE 子词，常见词一个 token
   • 中文句子 "我爱北京天安门" → BERT(5 tokens) vs Qwen(可能是 3-4 tokens)
   • 后果：同样的意思，中文 Token 数是英文的 1.5-3 倍！
   • 直接影响：API 成本更高、Context Window 能放的内容更少

4. 训练自己的 Tokenizer（高级操作，了解即可）：
   from tokenizers import Tokenizer, models, trainers
   tokenizer = Tokenizer(models.BPE())
   trainer = trainers.BpeTrainer(vocab_size=5000)
   tokenizer.train(files=["your_corpus.txt"], trainer=trainer)

{topic:"LLM 推理过程拆解：自回归生成 + KV Cache",hours:3,resource:"Hugging Face: Generation Strategies + vLLM blog",
detail:`【今日目标】理解 LLM 推理的内部机制——自回归生成、KV Cache、以及各种 Decoding 策略的区别。这直接关系到你的应用响应速度和成本。

【LLM 推理三大核心概念】
1. 自回归生成：
   → 输入 "今天天气" → 预测 "真" → 拼回去 "今天天气真" → 预测 "好" → ...
   → 每次预测一个 token，把结果拼到输入后面，如此循环
   → 问题：每次都要把整个输入重新过一遍模型——重复计算！

2. KV Cache——推理加速的核心技术：
   → 问题：预测第 101 个 token 时，前 100 个 token 的 K/V 已经算过了
   → 解法：把每一层的 K/V 矩阵缓存起来，预测新 token 时只算新的
   → 效果：推理速度提升 5-10 倍
   → 这也是为什么「prefill」（第一次输入）比「decode」（逐个生成）慢得多

3. Decoding 策略——控制模型输出：
   • Greedy：每次选概率最高的 token → 确定性最强，但输出多样性低
   • Beam Search：保留 K 条候选路径 → 适合翻译（需要精确匹配）
   • Sampling：按概率随机采样 → 有创造性，但可能不稳定
   • Temperature：T<1 让高概率的更高（更确定），T>1 让分布更均匀（更多样）
   • Top-K：只从概率最高的 K 个 token 中采样
   • Top-P (Nucleus)：从累积概率达到 P 的最小集合中采样（动态调整）

【动手练习——在 Jupyter 里跑以下对比】

       for top_p in [0.5, 0.9, 1.0]:
           用同一段 prompt 生成文本，对比输出
   → 直观感受参数对输出的影响

【今日产出】输出一份不同 Decoding 参数的对比表格。画图解释 KV Cache 的工作原理。`},
{topic:"推理 vs 训练 + 模型量化",hours:3,resource:"llama.cpp GitHub + GGUF 格式文档",
detail:`【今日目标】理解 LLM 的推理需求和硬件门槛，掌握模型量化的基本概念。不是所有模型都需要 A100——量化让 7B 模型在笔记本上就能跑。

【关键认知——训练 vs 推理】
训练 GPU 需求：
• 7B 模型全量训练：8×A100 80GB，数周到数月
• 7B 模型 LoRA 微调：1×A100 或 RTX 4090，数小时
• 7B 模型推理（FP16）：~14GB 显存，RTX 3090 就够了
• 7B 模型推理（INT4 量化）：~4GB 显存，笔记本都能跑！

量化——降低精度的艺术：
• FP32(32位浮点) → FP16(16位) → INT8(8位整数) → INT4(4位整数)
• 精度损失：INT8 ≤ 1%，INT4 ≈ 1-3%
• 内存节省：INT4 是 FP16 的 1/4！
• GGUF(lama.cpp 格式)：最流行的本地部署格式
• GPTQ/AWQ：GPU 上的量化方案

【今日产出】如果装了 Ollama，运行本地模型并记录推理速度。写一篇「模型量化的直观理解」笔记。`},
{topic:"LLM 训练全流程 (一)：Pre-training 阶段",hours:3,resource:"LLaMA 1/2/3 论文 + Falcon 论文 + C4 数据集文档",
detail:`【今日目标】理解 LLM 预训练的全流程——数据准备、训练目标、Scaling Law。不需要亲手训练，但要理解「这个阶段发生了什么」。

【预训练的 5 个步骤】
1. 数据收集：
   • Common Crawl（互联网快照）→ 包含所有网页内容
   • 书籍（Books3/Gutenberg）、代码（GitHub）、论文（ArXiv）、维基百科
   • 关键：数据的多样性决定模型的能力广度

2. 数据清洗——这是预训练最耗时的步骤：
   • 去重（MinHash/SimHash）：互联网上大量重复内容
   • 质量过滤：去掉低质量/垃圾/机器生成的内容
   • PII（个人信息）脱敏：去除邮箱/电话/身份证号
   • 启发式过滤：太短/太长的文本、非自然语言文本

3. 数据混合策略：
   • 代码数据：提升推理能力（GPT-4 代码能力远超 GPT-3）
   • 多语言数据：非英语能力
   • 不同来源的配比：书籍>网页>代码 的效果更好

4. 训练目标——Next Token Prediction：
   → 输入：前 N 个 token
   → 目标：预测第 N+1 个 token
   → Loss：Cross-Entropy（和你的 PyTorch 分类模型一样的 loss！）
   → 这就是为什么「语言模型越大，能力越强」——预测下一个词需要理解整个上下文

5. Scaling Law——投入产出比：
   • 模型大小 × 数据量 × 算力 三者遵循幂律关系
   • Chinchilla 定律：最优配置下，训练 Token 数 ≈ 20× 模型参数数
   • 7B 模型需要约 1.4T(1.4万亿) token 的训练数据

【今日产出】画一张预训练全流程图（数据收集→清洗→Tokenization→预训练→检查点保存）。标注每步的时间/资源占比。`},
{topic:"SFT + RLHF/DPO：让模型「听话」的关键技术",hours:3,resource:"InstructGPT 论文 + DPO 论文 + Anthropic RLHF 博客",
detail:`【今日目标】理解指令微调(SFT)和人类对齐(RLHF/DPO)的原理。这是 GPT-3 → ChatGPT 的关键一跳——预训练让模型「有知识」，SFT/RLHF 让模型「听话」。

【三阶段训练——面试必问】
1. Stage 1: Pre-training（预训练）
   → Next Token Prediction on 海量互联网文本
   → 产出：Base Model（如 GPT-3、Llama-3-base）
   → 能力：续写文本，但不能对话

2. Stage 2: SFT (Supervised Fine-Tuning，指令微调)
   → 收集高质量的「指令-回复」对（人工标注 or GPT-4 生成）
   → 在 Base Model 上继续训练（还是 Next Token Prediction）
   → 产出：SFT Model
   → 能力：会对话了，能遵循指令——但可能回答不准确/不安全

3. Stage 3: RLHF (Reinforcement Learning from Human Feedback)
   → Step A: 收集人类偏好数据（对同一问题，标注 A 比 B 好）
   → Step B: 训练 Reward Model（模拟人类偏好打分）
   → Step C: 用 PPO 强化学习优化 SFT Model（让 Reward 更高）
   → 产出：RLHF Model（ChatGPT/Claude）
   → 能力：更有帮助、更诚实、更无害

4. DPO——RLHF 的简化替代方案：
   → 不需要单独训练 Reward Model
   → 直接用偏好数据优化策略
   → 更简单、更稳定，效果接近 RLHF

【动手练习——对比 Base Model vs Instruct Model】
用 Ollama 或 Hugging Face 同时加载 base 版本和 instruct 版本的 Llama-3：
→ 输入："写一首关于春天的诗"
→ Base Model 可能输出："写一首关于春天的诗。春天来了，万物复苏。小明走在公园里，看到了..."（继续「续写」）
→ Instruct Model 输出：直接写一首诗
→ 这就是 SFT 的作用！

【今日产出】画一张 Base → SFT → RLHF 的三阶段流程图。用通俗语言（让小学生听懂）解释 RLHF 的原理。`}
]},

{topic:"Prompt 基础范式：Zero-shot、Few-shot、CoT",hours:3,resource:"Anthropic Prompt Engineering Guide + OpenAI Prompt Engineering Guide",
detail:`【今日目标】掌握三大基础 Prompt 范式，理解各自的适用场景。Prompt 是你的新编程语言——像写代码一样写 Prompt。

【动手练习——在 Claude/GPT 上一一测试】
1. Zero-shot（不给例子，直接问）：
   Bad: "分类这段话的情感。"
   Good: "你是一个情感分析专家。请将以下用户评论分类为「正面」「负面」或「中性」。只输出分类结果，不要解释。
   评论：这个手机拍照效果真不错，就是电池不太耐用。"
   → 改进点：设定角色、明确输出格式、提供约束

2. Few-shot（给 2-5 个例子）：
   在 Prompt 末尾加上：
   "
   示例：
   评论：质量太差了，用一周就坏了 → 负面
   评论：整体不错，性价比高 → 正面
   评论：快递很快，还没拆 → 中性
   "
   → 例子比描述更有效——模型从例子中学习你的期望，比从规则中学习更准确

3. Chain-of-Thought（让模型展示推理过程）：
   "请逐步分析以下数学题，列出每一步的计算过程，最后给出答案。
   题目：小明有 5 个苹果，给了小红 2 个，又买了 3 个，现在有几个？"
   → CoT 的效果尤其在数学/逻辑/推理场景中显著
   → "Let's think step by step" 这句魔法能够提升 20-50% 的准确率

【提示词工程原则——今天记住这 5 条】
① 设定角色：定义模型是谁（专家/助手/创意伙伴）
② 明确任务：清晰描述要做什么
③ 指定格式：告诉模型怎么输出（JSON/Markdown/列表）
④ 提供例子：Few-shot 比 Zero-shot 准确率高得多
⑤ 设定约束：什么不能做、输出长度限制、风格要求

【今日产出】用同一个任务（如情感分析），对比 Zero-shot / Bad Few-shot / Good Few-shot / CoT 四种 Prompt 的输出质量差异，整理成对比表格。`},
{topic:"ReAct 模式：Reasoning + Acting——Agent 的核心范式",hours:3,resource:"ReAct 论文 + LangChain ReAct Agent 文档",
detail:`【今日目标】掌握 ReAct（Reasoning + Acting）模式——这是 AI Agent 最核心的工作方式。理解 Thought → Action → Observation 的循环。

【ReAct 循环——Agent 的「思考-行动」循环】
1. 收到用户问题 "明天北京天气怎么样？适合户外运动吗？"
2. Thought（思考）：我需要先查询明天北京的天气
3. Action（行动）：调用天气 API → get_weather("北京", "2024-01-16")
4. Observation（观察）：API 返回 {天气:晴, 气温:5-12°C, 风力:2级, 空气质量:良}
5. Thought（再思考）：天气不错，各项指标都适合户外运动
6. Action：整理回答
7. Final Answer：明天北京晴天，5-12°C，风力2级，空气质量良。非常适合户外运动！

【动手练习——用 GPT/Claude 手动模拟 ReAct】
设计一个 Prompt，让模型在没有实际工具的情况下，模拟 ReAct 推理过程：
"
你需要回答用户的问题。但在给出答案前，你必须：
1. 先 Thinking（思考需要什么信息）
2. 然后 Action（调用工具，格式：ACTION: 工具名(参数)）
3. 然后 Observation（你观察到什么结果，格式：OBSERVATION: 结果）
4. 重复直到能回答问题
5. 最后给出 Final Answer

可用工具：search(关键词), calculator(表达式), weather(城市)
"
→ 你会看到模型在输出中生成一个完整的推理链

【ReAct 和 CoT 的区别】
• CoT：纯思考链，用于提升推理准确性
• ReAct：思考+行动交替，用于需要获取外部信息的场景
→ 实际项目中，ReAct 是构建 Agent 的标准模式

【今日产出】设计一个 ReAct Prompt，让 GPT-4/Claude 模拟解决一个需要多步工具调用的问题。记录完整的 Thought-Action-Observation 链。`},
{topic:"结构化输出：JSON Mode、Function Calling、Guided Generation",hours:3,resource:"OpenAI JSON Mode 文档 + Anthropic Tool Use 文档 + Outlines 项目",
detail:`【今日目标】掌握让 LLM 输出结构化数据的方法。非结构化文本无法直接用于业务逻辑——你需要 JSON、Schema、类型安全。

【三种结构化方案——从简单到复杂】
1. JSON Mode——最简单的方式：
   在 System Prompt 中指定：
   "你必须只输出 JSON 格式，不要有任何其他文字。
   JSON 格式：{'sentiment': '正面'|'负面'|'中性', 'confidence': 0-1, 'keywords': string[]}"
   → 问题：模型可能输出不完整的 JSON，或格式略有偏差
   → OpenAI/Claude 的 JSON Mode 在 API 层面强制合法 JSON

2. Function Calling / Tool Use——推荐方案：
   tools = [{
       "type": "function",
       "function": {
           "name": "classify_sentiment",
           "parameters": {
               "type": "object",
               "properties": {
                   "sentiment": {"type": "string", "enum": ["正面","负面","中性"]},
                   "confidence": {"type": "number", "minimum": 0, "maximum": 1},
                   "keywords": {"type": "array", "items": {"type": "string"}}
               },
               "required": ["sentiment", "confidence"]
           }
       }
   }]
   → 模型输出严格符合 Schema，不会有格式错误
   → 这是生产环境的推荐方案

3. Guided Generation——最强控制（用 Outlines）：
   import outlines
   model = outlines.models.transformers("microsoft/phi-2")
   generator = outlines.generate.json(model, YourPydanticModel)
   # 强制生成符合 Schema 的 JSON，token 级别控制

【动手练习——在 Python 脚本中实践】
   用 OpenAI Function Calling 实现一个文本分析 API：
   输入：一段用户评论
   输出：{sentiment, confidence, keywords, language, has_personal_info}
   验证输出格式是否正确。

【今日产出】完成 Function Calling 实战代码，输出格式化的 JSON 分析结果。对比 JSON Mode 和 Function Calling 的可靠性差异。`},

detail:`【今日目标】把软件工程最佳实践应用到 Prompt 开发——版本管理、单元测试、A/B 对比。这是 Java 工程师的独特优势！

【动手练习——建立 Prompt 工程的工具体系】
1. Prompt 版本管理——用 Git：
   prompts/
   ├── v1_sentiment_analysis.txt
   ├── v2_sentiment_analysis.txt    # 改进版
